<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Trend — Balance of Power</title>
  <style>
    :root {
      --bg: #eef2f7;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d7deea;
      --dem: #1268c4;
      --rep: #d62929;
      --other: #6653a6;
      --good: #16794a;
      --bad: #b42318;
      --shadow: 0 10px 30px rgba(31, 42, 68, .09);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body { padding: 22px; }

    .page {
      width: min(1500px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(27px, 3vw, 46px);
      letter-spacing: -.035em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    button {
      border: 1px solid #26364e;
      border-radius: 9px;
      padding: 10px 14px;
      background: #26364e;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .55; cursor: wait; }

    .auto-label {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .status {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(2, auto);
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      font-size: 14px;
    }

    .status strong { color: var(--ink); }
    .status .muted { color: var(--muted); }
    .status .ok { color: var(--good); }
    .status .error { color: var(--bad); }

    .chambers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .chamber {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chamber-head {
      padding: 18px 20px;
      color: #fff;
      background: #26364e;
    }

    .chamber-head h2 {
      margin: 0;
      font-size: 28px;
    }

    .chamber-meta {
      margin-top: 6px;
      color: rgba(255,255,255,.76);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .balance {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--line);
      background: #f9fbfd;
    }

    .balance-party {
      flex: 1 1 50%;
      min-width: 0;
      padding: 17px 19px;
    }

    .balance-party + .balance-party {
      border-left: 1px solid var(--line);
      text-align: right;
    }

    .balance-name {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .balance-number {
      margin-top: 3px;
      font-size: clamp(38px, 5vw, 68px);
      line-height: .95;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .dem { color: var(--dem); }
    .rep { color: var(--rep); }
    .other { color: var(--other); }

    .section {
      padding: 17px 19px;
      border-top: 1px solid var(--line);
    }

    .section:first-of-type { border-top: 0; }

    .section h3 {
      margin: 0 0 11px;
      font-size: 17px;
    }

    .party-block {
      border: 1px solid var(--line);
      border-radius: 11px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .party-block:last-child { margin-bottom: 0; }

    .party-title {
      padding: 10px 12px;
      font-weight: 800;
      background: #f4f7fb;
      border-bottom: 1px solid var(--line);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(110px, 1fr));
    }

    .metric {
      padding: 11px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }

    .metric:nth-child(4n) { border-right: 0; }

    .metric-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .045em;
      overflow-wrap: anywhere;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 23px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 9px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .045em;
      background: #f7f9fc;
    }

    td:last-child, th:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    tr:last-child td { border-bottom: 0; }

    .empty {
      padding: 38px 22px;
      text-align: center;
      color: var(--muted);
    }

    details.raw {
      margin-top: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    details.raw summary {
      padding: 14px 16px;
      cursor: pointer;
      font-weight: 800;
    }

    pre {
      margin: 0;
      padding: 16px;
      max-height: 500px;
      overflow: auto;
      border-top: 1px solid var(--line);
      background: #101828;
      color: #e6edf7;
      font: 12px/1.5 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1050px) {
      .chambers { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      header { flex-direction: column; }
      .controls { justify-content: flex-start; }
      .status { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric:nth-child(4n) { border-right: 1px solid var(--line); }
      .metric:nth-child(2n) { border-right: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>AP Trend Balance of Power</h1>
        <div class="subtitle">Complete House and Senate Trend data from the live in-memory hub cache.</div>
      </div>

      <div class="controls">
        <label class="auto-label">
          <input id="autoRefresh" type="checkbox" checked>
          Auto-refresh every 15 seconds
        </label>
        <button id="refreshBtn" type="button">Refresh now</button>
      </div>
    </header>

    <section class="status" aria-live="polite">
      <div>
        <strong>Status:</strong>
        <span id="statusText" class="muted">Loading…</span>
      </div>
      <div>
        <strong>Source:</strong>
        <span id="sourceText" class="muted">—</span>
      </div>
      <div>
        <strong>Page checked:</strong>
        <span id="checkedText" class="muted">—</span>
      </div>
    </section>

    <section id="chambers" class="chambers">
      <article class="chamber"><div class="empty">Loading House Trend data…</div></article>
      <article class="chamber"><div class="empty">Loading Senate Trend data…</div></article>
    </section>

    <details class="raw">
      <summary>Raw balance_of_power JSON</summary>
      <pre id="rawJson">Loading…</pre>
    </details>
  </main>

<script>
(() => {
  "use strict";

  const TREND_ENDPOINTS = {
    H: "/cache/trend/H",
    S: "/cache/trend/S"
  };

  const refreshBtn = document.getElementById("refreshBtn");
  const autoRefresh = document.getElementById("autoRefresh");
  const statusText = document.getElementById("statusText");
  const sourceText = document.getElementById("sourceText");
  const checkedText = document.getElementById("checkedText");
  const chambersEl = document.getElementById("chambers");
  const rawJson = document.getElementById("rawJson");

  let loading = false;
  let timer = null;

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function displayValue(value) {
    if (value === null || value === undefined || value === "") return "—";
    if (typeof value === "object") return JSON.stringify(value);
    return String(value);
  }

  function formatTimestamp(value) {
    if (!value) return "—";
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return String(value);
    return d.toLocaleString();
  }

  function extractBalanceOfPower(payload) {
    if (!payload || typeof payload !== "object") return null;

    if (payload.balance_of_power && typeof payload.balance_of_power === "object") {
      return payload.balance_of_power;
    }

    if (
      payload.data &&
      payload.data.balance_of_power &&
      typeof payload.data.balance_of_power === "object"
    ) {
      return payload.data.balance_of_power;
    }

    if (
      payload.balanceOfPower &&
      typeof payload.balanceOfPower === "object"
    ) {
      return payload.balanceOfPower;
    }

    // Also accept a route that returns {H:{...}, S:{...}} directly.
    if (
      (payload.H && typeof payload.H === "object") ||
      (payload.S && typeof payload.S === "object")
    ) {
      return payload;
    }

    return null;
  }

  async function fetchJsonText(url) {
    const response = await fetch(url, {
      cache: "no-store",
      headers: { "Accept": "application/json,text/plain,*/*" }
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const text = await response.text();
    try {
      return JSON.parse(text);
    } catch {
      throw new Error("Response was not valid JSON");
    }
  }

  async function loadData() {
    const [houseResult, senateResult] = await Promise.allSettled([
      fetchJsonText(TREND_ENDPOINTS.H),
      fetchJsonText(TREND_ENDPOINTS.S)
    ]);

    const balance = {};
    const errors = [];

    if (houseResult.status === "fulfilled") {
      balance.H = houseResult.value;
    } else {
      errors.push(`House ${TREND_ENDPOINTS.H}: ${houseResult.reason.message}`);
    }

    if (senateResult.status === "fulfilled") {
      balance.S = senateResult.value;
    } else {
      errors.push(`Senate ${TREND_ENDPOINTS.S}: ${senateResult.reason.message}`);
    }

    if (!balance.H && !balance.S) {
      throw new Error(errors.join(" | "));
    }

    return {
      balance,
      source: "live cache: /cache/trend/H + /cache/trend/S",
      payload: balance
    };
  }

  function partyClass(name) {
    const n = String(name || "").toLowerCase();
    if (n.includes("dem")) return "dem";
    if (n.includes("gop") || n.includes("rep")) return "rep";
    return "other";
  }

  function partyPriority(name) {
    const n = String(name || "").toLowerCase();
    if (n === "democrats" || n === "democratic") return 0;
    if (n === "gop" || n === "republicans" || n === "republican") return 1;
    if (n.includes("caucus with dem")) return 2;
    if (n.includes("caucus with gop")) return 3;
    if (n === "others") return 4;
    return 10;
  }

  function orderedParties(record) {
    return Object.entries(record?.parties || {})
      .sort((a, b) => partyPriority(a[0]) - partyPriority(b[0]) || a[0].localeCompare(b[0]));
  }

  function majorParties(record) {
    const rows = orderedParties(record);
    const dem = rows.find(([name]) => String(name).toLowerCase().includes("dem"));
    const rep = rows.find(([name]) => {
      const n = String(name).toLowerCase();
      return n.includes("gop") || n.includes("rep");
    });

    return [dem, rep].filter(Boolean).slice(0, 2);
  }

  function balanceMetric(row) {
    const trends = row?.[1]?.trends || {};
    return trends["Winning Trend"] ?? trends.Current ?? trends.Won ?? "—";
  }

  function renderBalance(record) {
    const majors = majorParties(record);

    if (!majors.length) return "";

    return `
      <div class="balance">
        ${majors.map(([name, row]) => `
          <div class="balance-party">
            <div class="balance-name">${escapeHtml(name)} — AP Winning Trend</div>
            <div class="balance-number ${partyClass(name)}">${escapeHtml(balanceMetric([name, row]))}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function metricCards(values) {
    const entries = Object.entries(values || {});
    if (!entries.length) return `<div class="empty">No values reported.</div>`;

    return `
      <div class="metrics">
        ${entries.map(([name, value]) => `
          <div class="metric">
            <div class="metric-label">${escapeHtml(name)}</div>
            <div class="metric-value">${escapeHtml(displayValue(value))}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function renderParty(name, row) {
    return `
      <div class="party-block">
        <div class="party-title ${partyClass(name)}">${escapeHtml(name)}</div>
        ${metricCards(row?.trends)}
        <div class="party-title">Net Change</div>
        ${metricCards(row?.net_change)}
      </div>
    `;
  }

  function renderInsufficient(values) {
    const entries = Object.entries(values || {});
    if (!entries.length) return `<div class="empty">No insufficient-vote breakdown reported.</div>`;

    return `
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Seats</th>
          </tr>
        </thead>
        <tbody>
          ${entries.map(([name, value]) => `
            <tr>
              <td>${escapeHtml(name)}</td>
              <td>${escapeHtml(displayValue(value))}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  function renderChamber(code, record) {
    const chamberName = code === "H" ? "House" : code === "S" ? "Senate" : code;

    if (!record || typeof record !== "object") {
      return `
        <article class="chamber">
          <div class="chamber-head"><h2>${escapeHtml(chamberName)}</h2></div>
          <div class="empty">No ${escapeHtml(chamberName)} Trend record is currently cached.</div>
        </article>
      `;
    }

    const parties = orderedParties(record);

    return `
      <article class="chamber">
        <div class="chamber-head">
          <h2>${escapeHtml(chamberName)}</h2>
          <div class="chamber-meta">
            Report: ${escapeHtml(displayValue(record.office))}<br>
            AP timestamp: ${escapeHtml(formatTimestamp(record.timestamp))}<br>
            Hub fetched: ${escapeHtml(formatTimestamp(record.fetched_at_utc || (record.fetched_at ? record.fetched_at * 1000 : null)))}<br>
            Office code: ${escapeHtml(displayValue(record.office_type_code))}
          </div>
        </div>

        ${renderBalance(record)}

        <div class="section">
          <h3>Party details</h3>
          ${parties.length
            ? parties.map(([name, row]) => renderParty(name, row)).join("")
            : `<div class="empty">No party rows reported.</div>`
          }
        </div>

        <div class="section">
          <h3>Insufficient Vote / Insufficient Data</h3>
          ${renderInsufficient(record.insufficient_vote)}
        </div>

        <div class="section">
          <h3>Source details</h3>
          <table>
            <tbody>
              <tr><td>Source URL</td><td>${escapeHtml(displayValue(record.source_url))}</td></tr>
              <tr><td>Test flag</td><td>${escapeHtml(displayValue(record.test))}</td></tr>
              <tr><td>AP timestamp</td><td>${escapeHtml(displayValue(record.timestamp))}</td></tr>
              <tr><td>Fetched epoch</td><td>${escapeHtml(displayValue(record.fetched_at))}</td></tr>
              <tr><td>Fetched UTC</td><td>${escapeHtml(displayValue(record.fetched_at_utc))}</td></tr>
            </tbody>
          </table>
        </div>
      </article>
    `;
  }

  function render(balance, source) {
    chambersEl.innerHTML =
      renderChamber("H", balance.H) +
      renderChamber("S", balance.S);

    rawJson.textContent = JSON.stringify(balance, null, 2);
    sourceText.textContent = source;
    checkedText.textContent = new Date().toLocaleString();

    const found = ["H", "S"].filter(code => balance[code]).join(" + ");
    statusText.textContent = found ? `Loaded ${found}` : "No chamber data found";
    statusText.className = found ? "ok" : "error";
  }

  async function refresh() {
    if (loading) return;

    loading = true;
    refreshBtn.disabled = true;
    statusText.textContent = "Loading…";
    statusText.className = "muted";

    try {
      const result = await loadData();
      render(result.balance, result.source);
    } catch (error) {
      statusText.textContent = "Could not load Trend data";
      statusText.className = "error";
      sourceText.textContent = "None";
      checkedText.textContent = new Date().toLocaleString();
      chambersEl.innerHTML = `
        <article class="chamber" style="grid-column:1/-1">
          <div class="chamber-head"><h2>Trend data unavailable</h2></div>
          <div class="empty">
            ${escapeHtml(error.message)}<br><br>
            Confirm that <strong>/cache/trend/H</strong> and <strong>/cache/trend/S</strong>
            are available and contain cached Trend data.
          </div>
        </article>
      `;
      rawJson.textContent = error.stack || error.message;
    } finally {
      loading = false;
      refreshBtn.disabled = false;
    }
  }

  function resetTimer() {
    if (timer) clearInterval(timer);
    timer = null;

    if (autoRefresh.checked) {
      timer = setInterval(refresh, 15000);
    }
  }

  refreshBtn.addEventListener("click", refresh);
  autoRefresh.addEventListener("change", resetTimer);

  resetTimer();
  refresh();
})();
</script>
</body>
</html>
