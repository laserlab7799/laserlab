<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>App Load Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  body{
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background:#0f1220;
    color:#e6e9f0;
    padding:16px;
  }
  h1{ margin:0 0 14px; font-size:20px }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap:12px;
    margin-bottom:18px;
  }
  .card{
    background:#1a1f3a;
    border-radius:10px;
    padding:14px;
  }
  .label{ font-size:12px; opacity:.7 }
  .value{ font-size:28px; font-weight:600; margin-top:6px }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  th,td{
    padding:6px 8px;
    border-bottom:1px solid #2b3160;
    text-align:left;
  }
  th{ opacity:.8 }
  .muted{ opacity:.6 }
</style>
</head>
<body>

<h1>🧠 App & Pipeline Load</h1>

<div class="grid">
  <div class="card">
    <div class="label">App Memory (RSS)</div>
    <div id="app-rss" class="value">–</div>
  </div>

  <div class="card">
    <div class="label">Pipelines Running</div>
    <div id="pipe-count" class="value">–</div>
  </div>

  <div class="card">
    <div class="label">Pipelines Total RSS</div>
    <div id="pipe-total" class="value">–</div>
  </div>
</div>

<div class="card">
  <div class="label">Active Pipelines</div>
  <table>
    <thead>
      <tr>
        <th>Target</th>
        <th>PID</th>
        <th>CPU %</th>
        <th>RSS MB</th>
        <th>Peak MB</th>
        <th>Runtime (s)</th>
      </tr>
    </thead>
    <tbody id="pipe-table">
      <tr><td colspan="6" class="muted">No pipelines running</td></tr>
    </tbody>
  </table>
</div>

<script>
const el = id => document.getElementById(id);

async function refresh(){
  try{
    const r = await fetch("/admin/system-usage");
    const d = await r.json();

    el("app-rss").textContent =
      Math.round(d.app_rss_mb) + " MB";

    el("pipe-count").textContent =
      d.pipeline_count;

    let pipeTotal = 0;
    const tbody = el("pipe-table");
    tbody.innerHTML = "";

    if (!d.pipelines || d.pipelines.length === 0){
      tbody.innerHTML =
        `<tr><td colspan="6" class="muted">No pipelines running</td></tr>`;
      el("pipe-total").textContent = "0 MB";
      return;
    }

    for (const p of d.pipelines){
      pipeTotal += p.rss_mb;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.key || "–"}</td>
        <td>${p.pid}</td>
        <td>${p.cpu_percent.toFixed(1)}</td>
        <td>${p.rss_mb.toFixed(1)}</td>
        <td>${p.peak_rss_mb.toFixed(1)}</td>
        <td>${p.runtime_sec}</td>
      `;
      tbody.appendChild(tr);
    }

    el("pipe-total").textContent =
      Math.round(pipeTotal) + " MB";

  } catch (e){
    console.error("refresh failed", e);
  }
}

refresh();
setInterval(refresh, 1000);
</script>

</body>
</html>
