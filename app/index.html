      } : aggregateHouseUncalledLeaderCountsNational();
      const called   = { ...(tallies.called || { DEM:0, REP:0, IND:0 }) };
      const uncalled = { ...(tallies.uncalled || { DEM:0, REP:0, IND:0 }) };
      if (!trendSnapshot && String(YEAR) === String(LIVE_YEAR) && BOP_OFFSETS && BOP_OFFSETS[`${YEAR}|H`]) {
          const o = BOP_OFFSETS[`${YEAR}|H`];
          called.DEM += (o.DEM || 0);
          called.REP += (o.REP || 0);
          called.IND += (o.IND || 0);
      }
      const noData = Number(tallies.noData || 0);
      const totalSeats = Math.max(1, Number(tallies.total || 0));
      const displayTotals = trendSnapshot?.winning || {
        DEM: called.DEM + uncalled.DEM,
        REP: called.REP + uncalled.REP,
        IND: called.IND + uncalled.IND
      };

      // --- 2) Build SVG scaffold (rotated group + arc) ---
      const w = 900, h = 520;
      const outerR = Math.min(w, h) * 0.45;
      const innerR = outerR * 0.58;

      const svg = d3.select(container)
        .html('') // clear previous render
        .append('svg')
          .attr('viewBox', `${-w/2} ${-h/2} ${w} ${h}`)
          .attr('aria-label', 'House Balance of Power');

      // rotate -90° so left→right order maps onto top semicircle
      // shift the horseshoe horizontally (px). negative = left, positive = right
      const HSHIFT = -50;

      const shoeG = svg.append('g')
        .attr('transform', `translate(${HSHIFT}, 0)`);

      const g = shoeG.append('g')
        .attr('transform', `rotate(-90) translate(0, ${h*0.08})`);

      const arc = d3.arc().innerRadius(innerR).outerRadius(outerR);

      // --- 3) Colors (solid for called, dim for uncalled) ---
      const DEM_SOLID = partySolid('DEM');
      const REP_SOLID = partySolid('REP');
      const IND_SOLID = partySolid('IND');
      const DEM_DIM   = partyDim('DEM');
      const REP_DIM   = partyDim('REP');
      const IND_DIM   = partyDim('IND');

      // --- 4) Segments in requested left→right order ---
      let segs = [
        { key:'DEM_CALLED',     value: called.DEM,     color: DEM_SOLID },
        { key:'DEM_UNCALLED',   value: uncalled.DEM,   color: DEM_DIM   },
        { key:'IND_CALLED',     value: called.IND,     color: IND_SOLID },
        { key:'IND_UNCALLED',   value: uncalled.IND,   color: IND_DIM   },
        { key:'NO_DATA',        value: noData,         color: COLOR_NO_DATA }, // neutral wedge
        { key:'REP_UNCALLED',   value: uncalled.REP,   color: REP_DIM   },
        { key:'REP_CALLED',     value: called.REP,     color: REP_SOLID },
      ].filter(s => s.value > 0);

      // placeholder if we have nothing yet (avoids NaNs)
      if (segs.length === 0){
        segs = [
          { key:'DEM_UNCALLED', value: 1, color: DEM_DIM },
          { key:'IND_UNCALLED', value: 1, color: IND_DIM },
          { key:'REP_UNCALLED', value: 1, color: REP_DIM },
        ];
      }

      // --- 5) Angle layout across π radians (top semicircle) ---
      // keep visual order left→right matching the array above
      segs = segs.reverse();

      const startAngle = Math.PI;
      const sumVals = segs.reduce((a,s)=>a+s.value, 0);
      let acc = 0;
      const angles = segs.map(s => {
        const a0 = startAngle - (acc / sumVals) * Math.PI;
        acc += s.value;
        const a1 = startAngle - (acc / sumVals) * Math.PI;
        return { ...s, a0, a1 };
      });

      // --- 6) Draw wedges ---
      g.selectAll('path.seg')
        .data(angles)
        .join('path')
          .attr('class','seg')
          .attr('d', d => arc({ startAngle: d.a0, endAngle: d.a1 }))
          .attr('fill', d => d.color)
          .attr('stroke', '#fff')
          .attr('stroke-width', 0);

      // --- 6.5) Midpoint tick (majority line) ---
      const mid = 0; // halfway between startAngle=π and endAngle=0
      g.append('line')
       .attr('x1', (innerR * 0.91) * Math.cos(mid))
       .attr('y1', (innerR * 0.91) * Math.sin(mid))
       .attr('x2', (outerR * 1.05) * Math.cos(mid))
       .attr('y2', (outerR * 1.05) * Math.sin(mid))
       .attr('stroke', '#000')
       .attr('stroke-width', 3)
       .attr('stroke-linecap', 'round')
       .attr('vector-effect', 'non-scaling-stroke');
       
       // --- 6.7) Majority label inside the horseshoe opening ---
       const majority = 218;  // e.g. 218 of 435
       const centerY  = innerR * 0.22;                   // pushes text into the opening

       const centerG = shoeG.append('g');                // unrotated (same as labelG)

       // big number

         .attr('x', 42)

       // "FOR MAJORITY"
       centerG.append('text')
         .attr('x', 42)
         .attr('y', centerY - 53)   // space below the number
         .attr('text-anchor', 'middle')
         .attr('font-family', 'Oswald, system-ui, sans-serif')
         .attr('font-weight', 700)
         .attr('font-size', 18)
         .attr('letter-spacing', 0.6)
         .attr('fill', '#111')
         .text('FOR MAJORITY');


      // --- 7) Compact TV-style party labels (upper-left / upper-right) ---
      // Unrotated labels so text is horizontal, using tspans for a manual line break
      const labelG = svg.append('g');
      const topY   = -outerR * 0.55; // vertical position above the arc
      const leftX  = -w/2 + 12;      // inset from left edge
      const rightX =  w/2 - 12;      // inset from right edge

      const DEM_DX = 167.5,  DEM_DY = -113;   // move Dems up & to the right
      const REP_DX = -187.5, REP_DY = -113;   // move Reps up & to the left

      // sizes + vertical gap between lines
      const LINE1_SIZE = 22;   // label size
      const LINE2_SIZE = 46;   // big number size
      const GAP        = 40;   // extra pixels between lines

      const demLine1 = 'DEMOCRATS';
      const repLine1 = 'REPUBLICANS';
      
      const SHOW_DELTA = false;

      const demLine2 = SHOW_DELTA && uncalled.DEM ? `${displayTotals.DEM} (+${uncalled.DEM})` : String(displayTotals.DEM);
      const repLine2 = SHOW_DELTA && uncalled.REP ? `${displayTotals.REP} (+${uncalled.REP})` : String(displayTotals.REP);

      // Democrats - upper left
      labelG.append('text')
        .attr('x', leftX + DEM_DX)
        .attr('y', topY  + DEM_DY)

        .attr('font-family','Oswald, system-ui, sans-serif')

      labelG.append('text')
        .attr('x', leftX + DEM_DX)
        .attr('y', topY + DEM_DY + LINE1_SIZE + GAP) // explicit offset below line 1
        .attr('text-anchor','start')

        .attr('fill', DEM_SOLID)
        .text(demLine2);

      // Republicans — upper right
      labelG.append('text')
        .attr('x', rightX + REP_DX)
        .attr('y', topY   + REP_DY)
        .attr('text-anchor','end')
        .attr('font-family','Oswald, system-ui, sans-serif')

        .attr('fill', REP_SOLID)
        .text(repLine1);

        .attr('x', rightX + REP_DX)

      }

    // Build USPS lists for each seat bucket used by the horseshoe painter
    function buildSenateUSPSBuckets2026(){
      const out = {
        dem_called: [], dem_leading: [],
        ind_called: [], ind_leading: [],
        rep_called: [], rep_leading: []
      };

      for (const usps of USPS_50_STATES){
        const fp = STATEFP_BY_USPS?.[usps];
        if (!fp) continue;

        // Called?
        const { status, winnerParty } = getStateCall(fp) || {};
        if (isRaceCalled(status)) {
          const P = normalizeParty(winnerParty);
          if (P === 'DEM') out.dem_called.push(usps);
          else if (P === 'REP') out.rep_called.push(usps);
          else out.ind_called.push(usps);
          continue;
        }

        // Not called → figure the leader by collapsing county votes to party
        const tallies = { DEM:0, REP:0, IND:0 };
        for (const [fips, row] of Object.entries(countyData || {})) {
          if (String(fips).length !== 5 || !String(fips).startsWith(fp)) continue;
          const cs = Array.isArray(row.candidates) ? row.candidates : [];
          for (const c of cs){
            const P = normalizeParty(c.party);
            const v = Number(c.votes ?? c.VoteCount ?? 0);
            if (Number.isFinite(v) && v > 0) tallies[P] = (tallies[P] || 0) + v;
          }
        }
        // single leader only (ties → no label)
        let leader = null, max = -1;
        for (const [p,v] of Object.entries(tallies)){
          if (v > max){ max = v; leader = p; }
          else if (v === max){ leader = null; }
        }
        if (leader === 'DEM') out.dem_leading.push(usps);
        else if (leader === 'REP') out.rep_leading.push(usps);
        else if (leader === 'IND') out.ind_leading.push(usps);
      }

      // Stabilize order within each bucket
      Object.keys(out).forEach(k => out[k].sort());
      return out;
    }

    /**
     * Post-pass: find the special seat dot(s), make them clickable, and overlay USPS text.
     * This is resilient to different class names you may already be using for the dot.
     * Accepted selectors: .seat.special, .special-seat, circle.special, circle.special-dot
     */
    function wireSenateSpecialSeatInteractions(svgEl){
      if (!svgEl) return;

      const candidates = svgEl.querySelectorAll(
        '.seat.special, .special-seat, circle.special, circle.special-dot'
      );

      candidates.forEach(node => {
        // Try to discover USPS/state code on the element or its <g> parent
        const host = node.closest('[data-usps]') || node;
        const usps =
          host?.dataset?.usps ||
          host?.getAttribute?.('data-usps') ||
          host?.getAttribute?.('data-state') ||
          host?.dataset?.state;

        if (!usps) return;

        // Ensure clickability
        node.style.pointerEvents = 'auto';
        node.style.cursor = 'pointer';

        // Click => seat-detail view (uses your existing seat detail renderer)
        node.addEventListener('click', (ev) => {
          ev.stopPropagation();
          try {
            // Your app already has a seat-detail path; reuse it:
            // showSeatDetail(office, usps, { special:true })
            showSeatDetail?.('S', usps, { special: true });
          } catch(e){
            console.warn('Special seat click handler error:', e);
          }
        }, { passive: true });

        // If it's a <circle>, overlay USPS inside the dot
        if (node.tagName.toLowerCase() === 'circle') {
          const cx = +node.getAttribute('cx');
          const cy = +node.getAttribute('cy');
          if (Number.isFinite(cx) && Number.isFinite(cy)) {
            const parent = node.parentNode || svgEl;
            // Remove any prior label to avoid duplicates on re-render
            const prior = parent.querySelector(`text.seat-usps[data-usps="${usps}"]`);
            if (prior) prior.remove();

            const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            t.setAttribute('class', 'seat-usps');
            t.setAttribute('data-usps', usps);
            t.setAttribute('x', cx);
            t.setAttribute('y', cy + 4);   // nudge baseline a hair down
            t.textContent = usps.toUpperCase();
            parent.appendChild(t);
          }
        }
      });
    }

      if (!g) return;
      if (usps) g.setAttribute('data-usps', usps);
      g.classList.add('seat', 'special');  // ensures our selector picks it up

            const uspsVal = list[i];                  // seat’s state abbreviation

            // tag the circle and make it clickable
            c.setAttribute('data-usps', uspsVal);
            c.style.pointerEvents = 'auto';
            c.style.cursor = 'pointer';
            c.addEventListener('click', (ev) => {
              ev.stopPropagation();
              onSenateBopSeatClick(uspsVal);          // ⬅️ hide chart + prepare seat detail
            });

            // label text (unchanged except using uspsVal we just read)
            const cx = parseFloat(c.getAttribute('cx'));
            const cy = parseFloat(c.getAttribute('cy'));
            const t  = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            t.setAttribute('class', 'seat-label');
            t.setAttribute('x', cx);
            t.setAttribute('y', cy + 4);
            t.setAttribute('text-anchor', 'middle');
            t.setAttribute('font-family', 'Oswald, system-ui, sans-serif');
            t.setAttribute('font-weight', '700');
            t.setAttribute('font-size', '11');
            t.setAttribute('pointer-events', 'none');

            const fill = c.style.fill || (COLOR_NO_DATA || '#cfcfcf');
            t.setAttribute('fill', (fill === (COLOR_NO_DATA || '#cfcfcf')) ? '#222' : '#fff');

            t.textContent = uspsVal;
            svg.appendChild(t);

            i++;
          }
        }


        // Drop labels into each painted bucket (order matches painter)
        labelSegment(demCalledStart,  data.dem_called,    buckets.dem_called);
        labelSegment(demLeadingStart, data.dem_leading,   buckets.dem_leading);
        labelSegment(indCalledStart,  data.ind_called,    buckets.ind_called);
        labelSegment(indLeadingStart, data.ind_leading,   buckets.ind_leading);
        labelSegment(repLeadingStart, data.rep_leading,   buckets.rep_leading);
        labelSegment(repCalledStart,  data.rep_called,    buckets.rep_called);
      }
      // === END per-bucket USPS labels ===
;

    wireSenateSpecialSeatInteractions(svg);
    
      // ------- helpers (ported from 7.html; DOM-native for speed) -------
      function colorWithData(d){
        const seats = Array.from(svg.querySelectorAll('circle.seat'));
        const left  = seats.slice(0, 50);       // far-left → center
        const right = seats.slice(50);          // far-right → center

        // start all grey
        seats.forEach(c => c.style.fill = REST);

        // one left→right list: left (left→center) + right (center→right)
        const ordered = left.concat(right.slice().reverse());

        // dem_called → dem_leading → ind_called → ind_leading → grey → rep_leading → rep_called
        let i = 0;
        i = paint(ordered, i, d.dem_called,    DEM_DARK);
        i = paint(ordered, i, d.dem_leading,   DEM_LIGHT);
        i = paint(ordered, i, d.ind_called,    IND_DARK);
        i = paint(ordered, i, d.ind_leading,   IND_LIGHT);

        const used = d.dem_called + d.dem_leading + d.ind_called + d.ind_leading + d.rep_leading + d.rep_called;
        const greyCount = Math.max(0, 100 - used);
        i += greyCount; // leave grey

        i = paint(ordered, i, d.rep_leading,   REP_LIGHT);
        i = paint(ordered, i, d.rep_called,    REP_DARK);
      }

      function paint(arr, start, count, color){
        const end = Math.min(start + Math.max(0, count), arr.length);
        for (let k = start; k < end; k++) arr[k].style.fill = color;
        return end;
      }

      // Geometry helpers (same as 7.html)
      function addQuarter(a0, a1, dir){
        const angles = spread(cfg.spokesPerSide, a0, a1);
        angles.forEach(deg => {
          const rad = toRad(deg);
          radii.forEach(r => {
            const x = cfg.cx + Math.cos(rad)*r + (dir||0)*cfg.halfOffsetX;
            const y = cfg.cy - Math.sin(rad)*r;
            svg.appendChild(seat(x, y, cfg.seatR));
          });
        });
      }
      function seat(x,y,r){ const c = ns('circle'); c.setAttribute('class','seat'); c.setAttribute('cx',x.toFixed(2)); c.setAttribute('cy',y.toFixed(2)); c.setAttribute('r',r); return c; }
      function line(x1,y1,x2,y2,cls){ const l = ns('line'); l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2); if(cls) l.setAttribute('class',cls); return l; }
      function text(x,y,str,cls){ const t = ns('text'); t.setAttribute('x',x); t.setAttribute('y',y); if(cls) t.setAttribute('class',cls); t.textContent=str; return t; }
      function spread(n, a, b){ if(n===1) return [(a+b)/2]; const out=[]; for(let i=0;i<n;i++){ out.push(a + (i/(n-1))*(b-a)); } return out; }
      function toRad(d){ return d*Math.PI/180; }
      function ns(tag){ return document.createElementNS("http://www.w3.org/2000/svg", tag); }
    }
    
    
    // Re-render the BOP horseshoe if we are in the right mode
      function renderBopIfActive(){
        if (!BOP_MODE) return;
        // ⬇️ don't redraw the Senate horseshoe if a seat detail is active
        if (OFFICE === 'S' && window._bopSeatView && window._bopSeatView.usps){
          renderSenateSeatDetail(window._bopSeatView.usps);  // keep the two-up cards fresh as data polls
          return;
        }


        const el = document.getElementById('bopChart');
        if (!el) return;

        if (OFFICE === 'H' && String(YEAR) === String(LIVE_YEAR)) {
          el.removeAttribute('hidden');
          renderHouseHorseshoe2026(el);
        } else if (OFFICE === 'S') {
          el.classList.remove('house');
          el.classList.add('senate');
          el.removeAttribute('hidden');
          renderSenateHorseshoeDiscrete(el);
        } else {
          hideBopChart();
        }
      }

  /* === BOP: instant render & prewarm ================================ */

  (function(){

    // Cached prewarm HTML so switching S/H is instant.

    const PREWARM = { H: "", S: "" };



    function computeHouseBopTotals(){
      try{
        if (window.TREND_BOP_MODE) {
          const trend = getTrendBopSnapshot('H');
          return trend ? {
            DEM: Number(trend.winning.DEM || 0),
            REP: Number(trend.winning.REP || 0),
            IND: Number(trend.winning.IND || 0),
            total: Number(trend.total || 0)
          } : {DEM:0, REP:0, IND:0, total:0};
        }

        const t = aggregateHouseUncalledLeaderCountsNational?.();
        if (!t) return {DEM:0, REP:0, IND:0, total:0};

        // called-only adjustments
        const key = `${YEAR}|H`;
        const off = (BOP_OFFSETS || {})[key] || {DEM:0, REP:0, IND:0};

        const calledAdj = {
          DEM: Number(t.called?.DEM || 0) + Number(off.DEM || 0),
          REP: Number(t.called?.REP || 0) + Number(off.REP || 0),
          IND: Number(t.called?.IND || 0) + Number(off.IND || 0),
        };

        // keep uncalled/leaders EXACTLY as-is
        const uncalled = t.uncalled || {DEM:0, REP:0, IND:0};

        // return combined (for the horseshoe rings / big ###), but with called adjusted only
        return {
          DEM: calledAdj.DEM + (uncalled.DEM || 0),
          REP: calledAdj.REP + (uncalled.REP || 0),
          IND: calledAdj.IND + (uncalled.IND || 0),
          total: Number(t.total || 0)
        };
      } catch(e){
        return {DEM:0, REP:0, IND:0, total:0};
      }
    }



    function computeSenateBopTotals(){
      try{
        if (window.TREND_BOP_MODE) {
          const trend = getTrendBopSnapshot('S');
          return trend ? {
            DEM: Number(trend.winning.DEM || 0),
            REP: Number(trend.winning.REP || 0),
            IND: Number(trend.winning.IND || 0),
            total: Number(trend.total || 100)
          } : {DEM:0, REP:0, IND:0, total:0};
        }

        const calledBase = countSenateCalled2026?.() || {DEM:0, REP:0, IND:0};
        const hold = (String(YEAR)==="2026" ? (SENATE_HOLDOVERS_2026||{DEM:0, REP:0, IND:0}) : {DEM:0, REP:0, IND:0});
        const called = {
          DEM: Number(calledBase.DEM + hold.DEM),
          REP: Number(calledBase.REP + hold.REP),
          IND: Number(calledBase.IND + hold.IND),
        };
        // ⬇️ apply admin overrides to the called bucket ONLY
        const calledAdj = applyBopOffsets(YEAR, 'S', { ...called });

        const leaders = countSenateLeaders2026?.() || {DEM:0, REP:0, IND:0};

        return {
          DEM: Number(calledAdj.DEM + leaders.DEM),
          REP: Number(calledAdj.REP + leaders.REP),
          IND: Number(calledAdj.IND + leaders.IND),
          total: 100
        };
      } catch(e){ return {DEM:0, REP:0, IND:0, total:0}; }
    }




    function updateBopTallies(kind){

      const box = document.getElementById('bopTallies');

      if (!box) return;

      let t = {DEM:0, REP:0, IND:0, total:0};

      if (kind === 'H') {
        t = computeHouseBopTotals();
        if (!window.TREND_BOP_MODE) t = applyBopOffsets(YEAR, 'H', t);
      } else if (kind === 'S') {
        t = computeSenateBopTotals();
        if (!window.TREND_BOP_MODE) {
          bopLog("Tallies pre-offset", {YEAR, kind, t: {...t}});
          t = applyBopOffsets(YEAR, kind, t);
          bopLog("Tallies post-offset", {YEAR, kind, t: {...t}});
        }
      }




      const fmt = n => Number(n||0).toLocaleString('en-US');

      box.innerHTML = [

        {party:'DEM', label:'DEMS', count:t.DEM},

        {party:'REP', label:'GOP',  count:t.REP},

        // show IND when non-zero so UI stays compact

        ...(t.IND ? [{party:'IND', label:'IND', count:t.IND}] : [])

      ].map(r => `

        <div class="party-row party-${r.party}">

          <div class="party-name">${r.label}</div>

          <div class="party-count">${fmt(r.count)}</div>

        </div>`).join("");

      box.removeAttribute('hidden');

    }
    // keep the function body exactly as-is, then add:
    window.updateBopTallies = updateBopTallies;



    function prewarmBopCharts(){
      const houseDiv  = document.getElementById('bopPrewarmHouse');
      const senateDiv = document.getElementById('bopPrewarmSenate');

      if (houseDiv){
        try {
          houseDiv.innerHTML = '';
          withCountyData(BOP_SHADOW.H || countyData, () => renderHouseHorseshoe2026(houseDiv));
          PREWARM.H = houseDiv.innerHTML;
        } catch {}
      }

      if (senateDiv){
        try {
          senateDiv.innerHTML = '';
          withCountyData(BOP_SHADOW.S || countyData, () => renderSenateHorseshoeDiscrete(senateDiv));
          PREWARM.S = senateDiv.innerHTML;
        } catch {}
      }
    }




    // One-shot show from prewarm (instant), then refresh live on next frame.

    function renderBopFromPrewarm(kind){

      const el = document.getElementById('bopChart');

      if (!el) return;

      resetBopChart?.(el);

      if (kind === 'H'){

        el.classList.add('house');

        el.innerHTML = PREWARM.H || '';

      } else if (kind === 'S'){

        el.classList.add('senate');

        el.innerHTML = PREWARM.S || '';

      }

      el.removeAttribute('hidden');

      updateBopTallies(kind);

      // hard refresh with live data on the very next frame

      requestAnimationFrame(() => renderBopImmediate(kind));

    }



    // Authoritative immediate render (no waiting on data fetch).

    function renderBopImmediate(kind){

      const el = document.getElementById('bopChart'); if (!el) return;

      resetBopChart?.(el);

      if (kind === 'H' && String(YEAR) === String(LIVE_YEAR)){

        el.classList.add('house');

        renderHouseHorseshoe2026?.(el);

        updateBopTallies('H');

      } else if (kind === 'S'){

        el.classList.add('senate');

        renderSenateHorseshoeDiscrete?.(el);

        updateBopTallies('S');

      } else {

        hideBopChart?.();

      }

    }



    // Define missing symmetric helper used elsewhere.

    window.showBopSenateChart = window.showBopSenateChart || function () {
      const el = document.getElementById('bopChart');
      if (!el) return;

      // Kill any stale seat-detail so polling can't bring it back
      window._bopSeatView = null;

      // Start from a clean slate
      resetBopChart?.(el);                    // clears innerHTML/inline styles
      el.classList.remove('seat-view', 'house', 'senate');
      el.removeAttribute('style');            // just in case transforms/margins linger
      el.removeAttribute('hidden');

      // Set target mode and render
      el.classList.add('senate');
      renderSenateHorseshoeDiscrete?.(el);

      // Optional: keep header/percent bolt in sync immediately
      updateHeaderTitle?.();
      syncPercentBolt?.();
    };


    // Final override to guarantee instant behavior when entering BOP.

    const __enter = window.enterBopMode;

    // enterBopMode override already exists; add a warm step right before showing
    window.enterBopMode = function(){
      try{
        const target = (OFFICE === 'S' || OFFICE === 'H') ? OFFICE : 'S';
        BOP_MODE = true;
        window.BOP_MODE = true;
        OFFICE = target;
        setHeaderForBop?.(true);
        document.body.classList.add('bop-mode');
        document.body.classList.toggle('trend-bop-mode', !!window.TREND_BOP_MODE);
        try { syncSideLogo?.(); } catch {}
        hidePercentInBolt?.();
        updateHeaderTitle?.();
        try { updateRaceAvailability?.(); } catch {}

        // The original scales warm map data; the Trend scales warm only the two Trend endpoints.
        const warmers = window.TREND_BOP_MODE
          ? [loadTrendBopData('S'), loadTrendBopData('H')]
          : [
              warmOfficeCache('S','G'),
              warmOfficeCache('H','G'),
              loadSenateSpecialCalledCounts()
            ];

        Promise.allSettled(warmers).finally(() => {
          renderBopImmediateFromShadow(target);
        });

        startLivePolling?.();
      }catch(e){
        __enter?.();
      }
    };

    // also tighten the office buttons while in BOP
    document.querySelectorAll('#allButtons button[data-office]').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        if (!BOP_MODE) return;
        const t = btn.dataset.office;
        if (t === 'P' || t === 'G') return;
        ev.stopPropagation?.();
        OFFICE = t;
        document.querySelectorAll('#allButtons button[data-office]')
          .forEach(b => b.classList.toggle('active', b.dataset.office === OFFICE));
        setHeaderForBop?.(true);
        // Keep the selected source exact when switching House/Senate inside BOP.
        const ready = window.TREND_BOP_MODE
          ? loadTrendBopData(t)
          : warmOfficeCache(t,'G');
        Promise.resolve(ready)
          .catch(() => null)
          .finally(() => renderBopImmediateFromShadow(t));
      }, true);
    });
    // Keep prewarm fresh: on DOM ready and after each poll tick.
    document.addEventListener('DOMContentLoaded', () => {
      try { prewarmBopCharts(); } catch {}
      try { loadSenateSpecialCalledCounts(); } catch {}
      try { loadBopOffsets(); } catch {}
    });
    // --- hard refresh every 10s ---
    setInterval(async () => {
      try {
        if (window.TREND_BOP_MODE) {
          await Promise.allSettled([loadTrendBopData('H'), loadTrendBopData('S')]);
        } else {
          await loadBopOffsets();
        }

        if (BOP_MODE || window.BOP_MODE) {
          try { prewarmBopCharts?.(); } catch {}
          try { updateBopTallies?.(OFFICE); } catch {}
          try { renderBopImmediateFromShadow?.(OFFICE); } catch {}
        }
      } catch (e) {
        // optional: console.warn('[BOP] refresh error', e);
      }
    }, 10_000);

    if (typeof pollAndRefresh === 'function'){
      const __poll = pollAndRefresh;
      window.pollAndRefresh = async function(){
        try {
          await __poll();
        } finally {
          // keep both office caches hot, then refresh the prewarmed HTML
           if (String(YEAR) === '2026') {
             await Promise.allSettled([ warmOfficeCache('S','G'), warmOfficeCache('H','G') ]);
          }
          requestAnimationFrame(prewarmBopCharts);
        }
      };
    }
  })();

  /* === end BOP: instant render & prewarm ============================ */

  function renderBopImmediateFromShadow(kind){
    const el = document.getElementById('bopChart'); if (!el) return;
    resetBopChart?.(el);
    if (kind === 'H' && String(YEAR) === String(LIVE_YEAR)){
      el.classList.add('house');
      withCountyData(BOP_SHADOW.H || countyData, () => {
        renderHouseHorseshoe2026(el);
        window.updateBopTallies?.('H');  // uses shadow cache → instant non-zero tallies
      });
    } else if (kind === 'S'){
      el.classList.add('senate');
      withCountyData(BOP_SHADOW.S || countyData, () => {
        renderSenateHorseshoeDiscrete(el);
        window.updateBopTallies?.('S');
      });
    } else {
      hideBopChart?.();
      return;
    }
    el.removeAttribute('hidden');
  }

</script>
