    /* ---- Responsive tokens ---- */
    :root{
      /* type scales with viewport, but stays readable */
      --text: clamp(14px, 0.95vw, 18px);

      /* header height scales but never silly */
      --header-h: clamp(48px, 6svh, 72px);

      /* outer gap around panels */
      --gap: clamp(8px, 1.6svh, 20px);

      /* left panel width scales with viewport */
      --left-w: clamp(20px, 24vw, 1420px); /* w123 */

      /* right rail width */
      --right-w: clamp(56px, 5vw, 96px);

      /* card corners & spacing in rem so they track font-size */
      --radius: 14px;
    }

    /* global type */
    html { font-size: var(--text); }

    /* header uses token instead of fixed px */
    header{
      height: var(--header-h);
      padding: clamp(8px, 1svh, 16px) clamp(12px, 1.6vw, 20px);
    }

    /* stage fills viewport minus header */
    .stage{
      width: 100vw;
      height: calc(100svh - var(--header-h));
    }

    /* map shell stays capped but fluid */
    .map-shell{
      width: min(1400px, 82vw);
      /* border-radius: var(--radius); */
    }

    /* panels float using fluid sizes */
    .left-panel{
      top: calc(var(--header-h) + var(--gap) + var(--left-panel-extra-top));
      bottom: var(--gap);
      left: calc(var(--gap) + 6.7vw);    /* the “move right 1vw” you wanted l123 */
      width: calc(var(--left-w) + 1.6vw);
      border-radius: 0;
    }
    .right-panel{
      top: 0;
      bottom: 0vh;
      right: var(--right-rail-right);
      width: var(--right-rail-w);
      border-radius: 0;
    }

    /* inside panel spacing scales with type */
    .left-panel .body,
    .right-panel .body{
      padding: clamp(8px, 1.2svh, 14px);
    }

    /* icon/thumb sizes scale gently */
    .cand-item img{
      width: clamp(120px, 20vw, 1200px);
      height: clamp(120px, 20vw, 1200px);
      border-radius: clamp(8px, 0.8vw, 12px);
    }

    /* gutters = space reserved for panels */
    :root{
      /* left panel’s x + its width + an extra gap */
      --gutter-left:  calc( (var(--gap) - 0vw) + var(--left-w) + var(--gap) );
      /* right rail width + gap */
      --gutter-right: calc( var(--right-w) + var(--gap) - 1.5vw);
    }

    /* let the stack sit between the gutters */
    .map-stack{
      position: relative;
      width: min(1400px, calc(100vw - var(--gutter-left) - var(--gutter-right)));
      margin-left:  var(--gutter-left);
      margin-right: var(--gutter-right);
      margin-top: 10vh;
      height: calc(100% - 0vh);
     /* margin-bottom: 400px; */
    }

    /* the shell just fills the stack (no extra margins) */
    .map-shell{
      width: 100%;
      margin: 0;
        height: calc(100% - 0px);  /* trims 40px off the bottom */
      }
    
    :root {
      --fade-left: 15%;   /* how wide the left fade is */
      --fade-right: 0%;  /* how wide the right fade is */
      --fade-top: 0%;
    }

    .map-shell{
      /* two masks: 1) left/right  2) top */
      -webkit-mask-image:
        linear-gradient(to right,
          transparent 0,
          black var(--fade-left),
          black calc(100% - var(--fade-right)),
          transparent 100%),
        linear-gradient(to bottom,
          transparent 0,
          black var(--fade-top),
          black 100%);

      mask-image:
        linear-gradient(to right,
          transparent 0,
          black var(--fade-left),
          black calc(100% - var(--fade-right)),
          transparent 100%),
        linear-gradient(to bottom,
          transparent 0,
          black var(--fade-top),
          black 100%);

      /* make the two layers intersect (AND) */
      -webkit-mask-composite: source-in;
      mask-composite: intersect;

      /* size/repeat per layer */
      -webkit-mask-size: 100% 100%, 100% 100%;
      mask-size: 100% 100%, 100% 100%;

      -webkit-mask-repeat: no-repeat, no-repeat;
      mask-repeat: no-repeat, no-repeat;
    }

      try{
        bopLog("Fetching /admin/bop …");
        const r = await fetch('/admin/bop?debug=1', {cache:'no-store'});
        if(!r.ok){
          bopLog("Fetch /admin/bop FAILED", r.status);
          return;

        const data = await r.json();
        const meta  = Number(data?.__meta?.mtime || 0);
        if (data && data.__meta) delete data.__meta;

        BOP_OFFSETS = data || {};
        window.BOP_OFFSETS = BOP_OFFSETS;   // belt & suspenders

        // When debug=1, backend will include {__meta:{path,mtime,keys}}
        if (data && data.__meta){
          bopLog("Offsets meta:", data.__meta);
          delete data.__meta;

        BOP_OFFSETS = data || {};
        window.BOP_OFFSETS = BOP_OFFSETS;
        bopLog("Loaded offsets keys:", Object.keys(BOP_OFFSETS));

        bopLog("Exception loading offsets:", e);
      }

      const row = (BOP_OFFSETS||{})[k];
      bopLog("applyBopOffsets key=", k, "row=", row, "before=", {...tallies});
      if(!row) return tallies;
      if(Number.isFinite(tallies.DEM)) tallies.DEM += Number(row.DEM||0);
      if(Number.isFinite(tallies.REP)) tallies.REP += Number(row.REP||0);
      if(Number.isFinite(tallies.IND)) tallies.IND += Number(row.IND||0);
      bopLog("applyBopOffsets after=", {...tallies});
      return tallies;
    }

    // Per-context key: YEAR|OFFICE|RACE
    function _ctxKey(){ return `ctx:${YEAR}|${OFFICE}|${RACE}`; }

    // Persist/restore the full rows map (countyData or district map)
    function _saveRowsSnapshot(map){
      try { localStorage.setItem(`rows::${_ctxKey()}`, JSON.stringify(map||{})); } catch{}
    }
    function _loadRowsSnapshot(){
      try { return JSON.parse(localStorage.getItem(`rows::${_ctxKey()}`) || 'null'); } catch { return null; }
    }

    // Candidate slug + headshot cache keys
    function _slug(name){ return String(name||'').toLowerCase().replace(/\./g,'').replace(/[^a-z0-9]+/g,'-').replace(/-/g,''); }
    function _hsKey(name){ return `hs::${_slug(name)}`; }
    function _hsHas(name){ try { return !!localStorage.getItem(_hsKey(name)); } catch { return false; } }
    function _hsGet(name){ try { return localStorage.getItem(_hsKey(name)); } catch { return null; } }
    function _hsSet(name,dataURL){ try { localStorage.setItem(_hsKey(name), dataURL); } catch{} }

    // Turn an <img> (already loaded) into a data URL and store it
    async function _snapshotHeadshot(img, name){
      try{
        if (!img || !name || _hsHas(name)) return;
        const w = img.naturalWidth  || img.width  || 0;
        const h = img.naturalHeight || img.height || 0;
        if (!w || !h) return;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0);
        const data = c.toDataURL('image/png');
        if (data && data.startsWith('data:image/')) _hsSet(name, data);
      }catch{}
    }

    // Given the current rows map, proactively fetch and cache headshots for all candidates we know about
    function _prefetchAllHeadshots(rowsMap){
      try{
        const names = new Set();
        for (const row of Object.values(rowsMap||{})){
          const cs = Array.isArray(row?.candidates) ? row.candidates : [];
          for (const c of cs){
            const nm = c?.name;
            if (nm && isAllowlistedName(nm) && !_hsHas(nm)) names.add(nm);
          }
          const st = Array.isArray(row?.state_topline) ? row.state_topline : [];
          for (const c of st){
            const nm = c?.name;
            if (nm && isAllowlistedName(nm) && !_hsHas(nm)) names.add(nm);
          }
        }
        const cap = 200; // cache up to 200 faces per context
        let i = 0;
        names.forEach(nm => {
          if (i++ >= cap) return;

          // Only prefetch a *real headshot* for allowlisted names.
          // Party icons are already preloaded elsewhere.
          if (!isAllowlistedName(nm)) return;

          const url = imgForCandidate(nm);
          const im = new Image();
          im.crossOrigin = 'anonymous';
          im.decoding = 'async';
          im.loading = 'eager';
          im.addEventListener('load', ()=> _snapshotHeadshot(im, nm), { once:true });
          im.src = url;
        });
      }catch{}
    }


    window.HIST_FETCH_OFF = false;
    window.HIST_ALLOW_XML_FALLBACK = false;

    
  // 1x1 transparent PNG as a data URL so fallback never hits the network
    const OTHER_FALLBACK =
      "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAAWgmWQ0AAAAASUVORK5CYII=";

    // url -> { count, last, backoff }  (failure history)
    const IMG_FAILS = new Map();
    const MAX_RETRIES       = 5;             // total foreground tries before a longer blackout
    const INITIAL_BACKOFF_MS= 5_000;         // first retry after 5s
    const MAX_BACKOFF_MS    = 15 * 60_000;   // cap at 15 minutes
    const BLACKOUT_MS       = 60 * 60_000;   // after MAX_RETRIES, suppress for 1 hour
    const BUST_PARAM        = "_retry";      // query key to bypass caches

    // Preload a real "../images/other.png" once at startup and snapshot to data-URL.
    // We still keep OTHER_FALLBACK as a guaranteed inline 1x1, but prefer the real art.
    let OTHER_IMG_DATA = null;
    (function preloadOtherFallback(){
      try {
        const im = new Image();
        im.decoding = "async";
        im.loading  = "eager";
        im.crossOrigin = "anonymous";
        im.addEventListener('load', () => {
          try {
            const c = document.createElement('canvas');
            c.width  = im.naturalWidth  || 1;
            c.height = im.naturalHeight || 1;
            c.getContext('2d').drawImage(im, 0, 0);
            const d = c.toDataURL('image/png');
            if (d && d.startsWith('data:image/')) OTHER_IMG_DATA = d;
          } catch {}
        }, { once:true });
        im.src = "../images/other.png";
      } catch {}
    })();

    
    
    function normUrl(u){
      try { return new URL(String(u||''), document.baseURI).href; }
      catch { return String(u||''); }
    }
    function addBust(u, n){
      try {
        const url = new URL(u, document.baseURI);
        url.searchParams.set(BUST_PARAM, String(n));
        return url.href;
      } catch { return u + (u.includes("?") ? "&" : "?") + `${BUST_PARAM}=${n}`; }
    }
    function shouldBlackout(u){
      const rec = IMG_FAILS.get(u);
      if (!rec) return false;
      if (rec.count < MAX_RETRIES) return false;
      return (Date.now() - rec.last) < BLACKOUT_MS;
    }

    // Return a retry *plan* with URL + delay based on exponential backoff,
    // or null if we should not retry yet.
    function nextRetryPlan(u){
      const now = Date.now();
      const rec = IMG_FAILS.get(u) || { count: 0, last: 0, backoff: INITIAL_BACKOFF_MS };

      // long blackout once we've exhausted foreground tries
      if (rec.count >= MAX_RETRIES && (now - rec.last) < BLACKOUT_MS) return null;

      // if we're still inside the current backoff window, skip
      if ((now - rec.last) < (rec.backoff || INITIAL_BACKOFF_MS)) return null;

      // compute next backoff (exponential with cap)
      const nextCount   = Math.min(rec.count + 1, MAX_RETRIES);
      const nextBackoff = Math.min((rec.backoff || INITIAL_BACKOFF_MS) * 2, MAX_BACKOFF_MS);

      IMG_FAILS.set(u, { count: nextCount, last: now, backoff: nextBackoff });

      return {
        url: addBust(u, nextCount),
        delayMs: rec.backoff || INITIAL_BACKOFF_MS
      };
    }


    // 1) Quietly record successes so future sets aren't blocked
    // When any candidate image successfully loads, snapshot it once to the cache
    window.addEventListener('load', (ev) => {
      const img = ev.target;
      if (!(img instanceof HTMLImageElement)) return;
      const name = img.dataset?.cand;
      if (name && !_hsHas(name)) _snapshotHeadshot(img, name);
    }, true);


    // 2) On error: swap to fallback immediately, schedule a retry when allowed
    document.addEventListener('error', (ev) => {
      const img = ev.target;
      if (!(img instanceof HTMLImageElement)) return;
      // Try our cached real headshot first
      const candName = img.dataset?.cand;
      if (candName) {
        const cached = _hsGet(candName);
        if (cached && img.src !== cached) {
          img.onerror = null;
          img.src = cached;
          return; // don't drop to other.png
        }
      }

      const bad = normUrl(img.currentSrc || img.src);
      if (!bad) return;

      // mark failure moment
      const rec = IMG_FAILS.get(bad) || { count: 0, last: 0 };
      IMG_FAILS.set(bad, { count: rec.count + 1, last: Date.now() });

      // show fallback now (no flash of broken image)
      // show fallback now (no flash of broken image)
      const safeOther = OTHER_IMG_DATA || OTHER_FALLBACK;
      if (img.src !== safeOther) {
        img.dataset.fallbackApplied = "1";
        img.onerror = null; // stop loops on fallback itself
        img.src = safeOther;
      }


      // if we can try again later, schedule a background pre-decode and then swap atomically
      // if we can try again later, schedule a background pre-decode using exponential backoff
      const plan = nextRetryPlan(bad);
      if (!plan) return;

      const probe = new Image();
      probe.decoding = "async";
      probe.loading  = "eager";
      probe.addEventListener('load', () => {
        IMG_FAILS.delete(bad); // clear failure memory on success
        requestAnimationFrame(() => {
          img.dataset.fallbackApplied = "";
          img.src = plan.url; // cache-busted, should hit the newly good URL
        });
      }, { once: true });
      probe.addEventListener('error', () => {
        // stay on data-URL fallback; the next backoff window will plan another try
      }, { once: true });

      // start probe after the planned backoff delay
      setTimeout(() => { probe.src = plan.url; }, plan.delayMs);

    }, true);

    // 3) Intercept future sets: only hard-block while inside a blackout window
    (() => {
      const d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      if (d?.set) {
        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          configurable: true, enumerable: d.enumerable,
          get(){ return d.get.call(this); },
          set(v){
            const u = normUrl(v);
            if (u && shouldBlackout(u)) {
              this.dataset.fallbackApplied = "1";
              return d.set.call(this, (OTHER_IMG_DATA || OTHER_FALLBACK));
            }
            return d.set.call(this, v);
          }
        });
      }

      const origSetAttr = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function(name, val){
        if (this instanceof HTMLImageElement && String(name).toLowerCase() === 'src') {
          const u = normUrl(val);
          if (u && shouldBlackout(u)) {
            this.dataset.fallbackApplied = "1";
            return origSetAttr.call(this, 'src', (OTHER_IMG_DATA || OTHER_FALLBACK));
          }
        }
        return origSetAttr.call(this, name, val);
      };
    })();

    // ---- Gauge wiring ----
    function updateGaugeForRace({ office, state, district }) {

    function gaugeCandidateParty(item){

    function syncGaugeCandidateCards(){

    // =========================
    // IFRAME PEN OVERLAY (Gauge/Chart/Box)
    // =========================
    let _frameWhich = "gauge";

    const _frameInk = {
      gauge: [],
      chart: [],
      chart2: [],
      chart3: [],
      box:   [],
      box2:  []
    };

    let frameInkCanvas = null;
    let frameInkCtx = null;
    let frameDrawing = false;
    let frameDidDrag = false;
    let frameLastPt = null;
    let frameStroke = null;

    const FRAME_MIN_DRAG_PX = 3;
    const FRAME_SEGMENT_PX  = 2.0;
    const FRAME_BASE_WIDTH  = 3.5;
    let frameRAF = null;
    let frameDpr = 1;


    function ensureFrameInkCanvas(){
      if (frameInkCanvas) return;

      frameInkCanvas = document.getElementById("frameInkCanvas");
      if (!frameInkCanvas) return;

      frameInkCtx = frameInkCanvas.getContext("2d", { alpha: true });

      // pointer handlers
      frameInkCanvas.addEventListener("pointerdown", frameInkStart, { passive: false });
      frameInkCanvas.addEventListener("pointermove", frameInkMove,  { passive: false });
      frameInkCanvas.addEventListener("pointerup",   frameInkEnd,   { passive: false });
      frameInkCanvas.addEventListener("pointercancel", frameInkEnd, { passive: false });
      frameInkCanvas.addEventListener("pointerleave",  frameInkEnd, { passive: false });
    }

    function resizeFrameInkCanvas(){
      if (!frameInkCanvas) return;

      const shell = document.getElementById("gaugeShell");
      if (!shell) return;

      const r = shell.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      frameDpr = dpr;

      frameInkCanvas.width  = Math.round(r.width  * dpr);
      frameInkCanvas.height = Math.round(r.height * dpr);

      frameInkCanvas.style.width  = r.width + "px";
      frameInkCanvas.style.height = r.height + "px";

      // draw in CSS pixels
      frameInkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      frameInkCtx.lineCap = "round";
      frameInkCtx.lineJoin = "round";

      redrawFrameInk();
    }

    function redrawFrameInk(){
      if (!frameInkCtx || !frameInkCanvas) return;

      // Clear in CSS pixel space (because ctx transform is DPR-scaled)
      const w = frameInkCanvas.width  / (frameDpr || 1);
      const h = frameInkCanvas.height / (frameDpr || 1);

      frameInkCtx.setTransform(frameDpr || 1, 0, 0, frameDpr || 1, 0, 0);
      frameInkCtx.clearRect(0, 0, w, h);

      const strokes = _frameInk[_frameWhich] || [];
      for (const s of strokes){
        const pts = s.pts || [];
        if (pts.length < 2) continue;

        frameInkCtx.strokeStyle = s.color || "#000";
        frameInkCtx.lineWidth   = s.w || FRAME_BASE_WIDTH;

        frameInkCtx.beginPath();
        frameInkCtx.moveTo(pts[0][0], pts[0][1]);

        // quadratic midpoint smoothing (keep your existing look)
        for (let i = 1; i < pts.length - 1; i++){
          const midX = (pts[i][0] + pts[i+1][0]) / 2;
          const midY = (pts[i][1] + pts[i+1][1]) / 2;
          frameInkCtx.quadraticCurveTo(pts[i][0], pts[i][1], midX, midY);
        }

        const last = pts[pts.length - 1];
        frameInkCtx.lineTo(last[0], last[1]);
        frameInkCtx.stroke();
      }
    }


    function activeFrameIsInkable(){
      return (_frameWhich === "gauge" || _frameWhich === "chart" || _frameWhich === "chart2" || _frameWhich === "chart3" || _frameWhich === "box" || _frameWhich === "box2");
    }

    function syncFrameInkOverlay(){
      ensureFrameInkCanvas();
      if (!frameInkCanvas) return;

      // Visible any time we're in gauge/chart/box mode (so ink stays on-screen)
      const visible = document.body.classList.contains("gauge-mode") && activeFrameIsInkable();

      // Only interactive (captures pointer) when pen is actually selected
      const interactive = (inkMode === "pen") && visible;

      frameInkCanvas.hidden = !visible;
      frameInkCanvas.style.pointerEvents = interactive ? "auto" : "none";

      // Keep it correctly sized + redraw stored strokes whenever it’s visible
      if (visible){
        requestAnimationFrame(resizeFrameInkCanvas);
      }
    }


    function frameInkStart(e){
      if (inkMode !== "pen") return;
      if (!document.body.classList.contains("gauge-mode")) return;
      if (!activeFrameIsInkable()) return;

      e.preventDefault();
      e.stopPropagation();

      frameDrawing = true;
      frameDidDrag = false;
      frameLastPt = null;

      try { frameInkCanvas.setPointerCapture(e.pointerId); } catch {}

      const rect = frameInkCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      frameStroke = { color: "#000", w: FRAME_BASE_WIDTH, pts: [[x,y]] };
      _frameInk[_frameWhich].push(frameStroke);
      frameLastPt = [x,y];
    }

    function frameInkMove(e){
      if (!frameDrawing || inkMode !== "pen") return;

      e.preventDefault();
      e.stopPropagation();

      const rect = frameInkCanvas.getBoundingClientRect();

      const events = (typeof e.getCoalescedEvents === "function")
        ? e.getCoalescedEvents()
        : [e];

      for (const ev of events){
        const cx = ev.clientX ?? e.clientX;
        const cy = ev.clientY ?? e.clientY;
        const x = cx - rect.left;
        const y = cy - rect.top;

        // drag threshold
        if (!frameDidDrag && frameStroke && frameStroke.pts.length){
          const x0 = frameStroke.pts[0][0], y0 = frameStroke.pts[0][1];
          const dx = x - x0, dy = y - y0;
          if ((dx*dx + dy*dy) >= (FRAME_MIN_DRAG_PX*FRAME_MIN_DRAG_PX)) frameDidDrag = true;
        }

        // downsample by ~screen px
        if (!frameLastPt){
          frameStroke.pts.push([x,y]);
          frameLastPt = [x,y];
          continue;
        }
        const dx = x - frameLastPt[0];
        const dy = y - frameLastPt[1];
        if ((dx*dx + dy*dy) >= (FRAME_SEGMENT_PX*FRAME_SEGMENT_PX)){
          frameStroke.pts.push([x,y]);
          frameLastPt = [x,y];
        }
      }

      if (frameRAF == null){
        frameRAF = requestAnimationFrame(() => {
          frameRAF = null;
          redrawFrameInk();
        });
      }
    }

    function frameInkEnd(e){
      if (inkMode !== "pen") return;
      if (!frameDrawing) return;
      if (frameRAF != null){
        cancelAnimationFrame(frameRAF);
        frameRAF = null;
      }

      e.preventDefault();
      e.stopPropagation();

      // tap: remove dot + swallow follow-on click
      if (!frameDidDrag){
        const arr = _frameInk[_frameWhich];
        arr.pop();
        window.__suppressNextClick = true;
        setTimeout(() => { window.__suppressNextClick = false; }, 0);
        redrawFrameInk();
      }

      frameDrawing = false;
      frameLastPt = null;
      frameStroke = null;

      try { frameInkCanvas.releasePointerCapture(e.pointerId); } catch {}
    }

    function clearFrameInk(){
      _frameInk.gauge = [];
      _frameInk.chart = [];
      _frameInk.chart2 = [];
      _frameInk.chart3 = [];

    // Optional wrappers if you like your old names:

    // === TABLE mode (reads points_by_x from statewide_plot_data_*.json) ===
    let TABLE_SOURCE_PATH = null;
    let TABLE_POLL_ID = null;
    const TABLE_POLL_MS = 5000;

    function fmtTableNum(v){
      if (v === null || v === undefined) return "—";
      const n = Number(v);
      if (!Number.isFinite(n)) return "—";
      return n.toFixed(2);
    }

    function renderPointsTableFromJson(json){
      try{
        const tbody = document.querySelector("#pointsTable tbody");
        if (!tbody) return;

        const pbx = json?.points_by_x || {};
        const rows = Object.entries(pbx)
          .map(([x, v]) => {
            const adj = v?.adjusted || {};
            const raw = v?.raw || {};
            return {
              x: Number(x),
              h_raw: raw?.H,
              h_adj: adj?.H,
              t_raw: raw?.T,
              t_adj: adj?.T,
            };
          })
          .filter(r => Number.isFinite(r.x))
          .sort((a,b) => b.x - a.x);

        let html = "";
        for (const r of rows){
          html += `<tr>
            <td>${r.x.toFixed(2)}</td>
            <td>${fmtTableNum(r.h_raw)}</td>
            <td>${fmtTableNum(r.h_adj)}</td>
            <td>${fmtTableNum(r.t_raw)}</td>
            <td>${fmtTableNum(r.t_adj)}</td>
          </tr>`;
        }
        tbody.innerHTML = html;
      }catch(e){
        console.warn("[table] render error:", e);
      }
    }

    async function fetchAndRenderTableOnce(){
      if (!TABLE_SOURCE_PATH) return;
      try{
        const url = `${TABLE_SOURCE_PATH}?t=${Date.now()}`; // cache-bust
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        renderPointsTableFromJson(json);
      }catch(e){
        console.warn("[table] fetch error:", e);
      }
    }

    function startTablePolling(){
      if (TABLE_POLL_ID) return;
      TABLE_POLL_ID = setInterval(fetchAndRenderTableOnce, TABLE_POLL_MS);
      // do an immediate paint too
      fetchAndRenderTableOnce();
    }

    // Sum shown candidates and add a single "Other" bucket with remaining votes
    function withAllowedPlusOther(candidates, total){
      const shown = onlyAllowed(candidates).slice();
      const shownVotes = shown.reduce((a,c)=> a + (c.votes || 0), 0);
      const otherVotes = Math.max(0, (total || 0) - shownVotes);

      // sort allowed candidates by votes
      shown.sort((a,b)=> (b.votes||0) - (a.votes||0));

      // append a single "Other" row LAST (pin to bottom)
      if (otherVotes > 0){
        shown.push({ name: 'Other', party: 'IND', votes: otherVotes, _isOther: true });
      }
      return shown;
    }

    // Transform ../temp/primary_cache.json → {rows:[...]} like /cache/ru
    async function loadPrimarySnapshotFallback(office, race){
      const snap = await getJSON('../temp/primary_cache.json');
      if (!snap || !snap.cache_by_combo) return null;

      const key    = `${office}:${race}`;           // e.g. "P:D", "H:R", "S:D", "G:R"
      const bucket = snap.cache_by_combo[key] || {};
      const states = bucket.states || {};
      const rows   = [];

      for (const [usps, blob] of Object.entries(states)) {
        const rc  = (blob.race_call || {});
        const win = (rc.winner || {});

        // Counties (P, S, G commonly)
        for (const [fips, c] of Object.entries(blob.counties || {})) {
          rows.push({
            state: usps,
            fips,
            name: c.name,
            candidates: c.candidates,
            total: c.total,
            updated: blob.updated,
            percent_in: c.percent_in,
            state_percent_in: blob.percent_in,
            state_topline: blob.state_topline || [],
            state_total: blob.state_total || 0,
            race_call_status: rc.status || 'No Decision',
            race_called_winner_name: win.name,
            race_called_winner_party: win.party,
          });
        }

        // Districts (H; some states may also surface district-level in primaries)
        for (const [distId, drow] of Object.entries(blob.districts || {})) {
          rows.push({
            state: usps,
            fips: distId,                 // your /cache/ru shape accepts id here
            name: drow.name || distId,    // keep consistent with your renderer
            candidates: drow.candidates,
            total: drow.total,
            updated: blob.updated,
            percent_in: drow.percent_in,
            state_percent_in: blob.percent_in,
            state_topline: blob.state_topline || [],
            state_total: blob.state_total || 0,
            race_call_status: rc.status || 'No Decision',
            race_called_winner_name: win.name,
            race_called_winner_party: win.party,
          });
        }
      }

      // Keep sort like /cache/ru
      rows.sort((a, b) => (a.state === b.state)
        ? ((+a.fips || 0) - (+b.fips || 0))
        : (a.state < b.state ? -1 : 1));

      return { rows };
    }

    function tallyEVs(winners){

        if (w.statewide) {

    function trendBopParty(record, wantedTitle){
      const wanted = String(wantedTitle || "").trim().toLowerCase();
      const entries = Object.entries(record?.parties || {});
      const match = entries.find(([title]) => String(title).trim().toLowerCase() === wanted);
      return match?.[1] || { trends:{}, net_change:{} };
    }

    function trendBopValue(row, wantedName){
      const wanted = String(wantedName || "").trim().toLowerCase();
      const entries = Object.entries(row?.trends || {});
      const match = entries.find(([name]) => String(name).trim().toLowerCase() === wanted);
      return trendBopInt(match?.[1]);

    function buildTrendBopSnapshot(record, office){
      if (!record || typeof record !== "object") return null;

      const dem       = trendBopParty(record, "Dem");
      const gop       = trendBopParty(record, "GOP");
      const caucusDem = trendBopParty(record, "Others Caucus with Dem");
      const caucusGop = trendBopParty(record, "Others Caucus with GOP");
      const others    = trendBopParty(record, "Others");

      const sum = (rows, field) => rows.reduce((total, row) => total + trendBopValue(row, field), 0);
      const demRows = [dem, caucusDem];
      const repRows = [gop, caucusGop];
      const indRows = [others];

      const won = {
        DEM: sum(demRows, "Won"),
        REP: sum(repRows, "Won"),
        IND: sum(indRows, "Won")
      };
      const leading = {
        DEM: sum(demRows, "Leading"),
        REP: sum(repRows, "Leading"),
        IND: sum(indRows, "Leading")
      };
      const holdovers = {
        DEM: sum(demRows, "Holdovers"),
        REP: sum(repRows, "Holdovers"),
        IND: sum(indRows, "Holdovers")
      };
      const winning = {
        DEM: sum(demRows, "Winning Trend"),
        REP: sum(repRows, "Winning Trend"),
        IND: sum(indRows, "Winning Trend")
      };
      const called = {
        DEM: won.DEM + holdovers.DEM,
        REP: won.REP + holdovers.REP,
        IND: won.IND + holdovers.IND
      };

      const insufficientEntries = Object.entries(record?.insufficient_vote || {});
      const insufficientTotalEntry = insufficientEntries.find(
        ([name]) => String(name).trim().toLowerCase() === "total"
      );
      const insufficientTotal = trendBopInt(insufficientTotalEntry?.[1]);
      const total =
        called.DEM + called.REP + called.IND +
        leading.DEM + leading.REP + leading.IND +
        insufficientTotal;

      return {
        office: String(office || record.office_type_code || "").toUpperCase(),
        record,
        won,
        leading,
        holdovers,
        called,
        winning,
        insufficientTotal,
        total
      };
    }

          else if (P === 'REP') out.REP++;
          else out.IND++;
        }
      }

      // Also add S:S called winners (preloaded by loadSenateSpecialCalledCounts)
      const specials = window.SPECIAL_SENATE_CALLED_COUNTS || { DEM:0, REP:0, IND:0 };
      out.DEM += specials.DEM;
      out.REP += specials.REP;
      out.IND += specials.IND;

      return out;
    }


    function countSenateLeaders2026(){
      // Prefer the rollup-based leader counter if present
      const viaRollup =
        (typeof aggregateSenateUncalledLeaderCountsFromRollup === 'function'
          ? aggregateSenateUncalledLeaderCountsFromRollup()
          : null)
        || (typeof aggregateSenateUncalledLeaderCounts2026 === 'function'
          ? aggregateSenateUncalledLeaderCounts2026()
          : null);

      // Normalize output to { DEM, REP, IND }
      if (viaRollup && (viaRollup.DEM!=null || viaRollup.REP!=null || viaRollup.IND!=null)) {
        return {
          DEM: Number(viaRollup.DEM||0),
          REP: Number(viaRollup.REP||0),
          IND: Number(viaRollup.IND||0),
        };
      }
      // Fallback: no leaders known
      return { DEM:0, REP:0, IND:0 };
    }

    
    // Senate 2026 — "uncalled leaders" using the SAME logic as national rollup/map paint
    function aggregateSenateUncalledLeaderCountsFromRollup(){
      const out = { DEM:0, REP:0, IND:0 };

      for (const usps of USPS_50_STATES){
        if (isNoRace2026(usps)) continue;              // ⟵ exclude no-race states
        const fp = STATEFP_BY_USPS?.[usps];

        if (!fp) continue;

        // Use the same call test the rollup/map uses
        const { status } = getStateCall(fp);
        if (isRaceCalled(status)) continue; // only count states NOT called

        // Collapse multiple same-party candidates to one party bucket
        const tallies = { DEM:0, REP:0, IND:0 };
        for (const [fips, row] of Object.entries(countyData || {})) {
          if (String(fips).length !== 5 || !String(fips).startsWith(fp)) continue;
          const cs = Array.isArray(row.candidates) ? row.candidates : [];
          for (const c of cs){
            const P = normalizeParty(c.party);
            const v = Number(c.votes ?? c.VoteCount ?? 0);
            if (!Number.isFinite(v) || v <= 0) continue;
            tallies[P] = (tallies[P] || 0) + v;
          }
        }

        // Pick a single leader (ties don't count)
        let leader = null, max = -1;
        for (const [p,v] of Object.entries(tallies)){
          if (v > max){ max = v; leader = p; }
          else if (v === max){ leader = null; }
        }
        if (leader) out[leader] += 1;
      }
      return out;
    }


    // Senate 2026 — count uncalled leaders by party (DEM/REP/IND) from county rows
    function aggregateSenateUncalledLeaderCounts2026(){
      const out = { DEM:0, REP:0, IND:0 };

      // scan the 50 states
      for (const usps of USPS_50_STATES){
        if (isNoRace2026(usps)) continue;              // ⟵ exclude no-race states
        const { status, winnerParty } = getSenate2026Topline(usps);

        const called = isRaceCalled(status);

        if (called) continue;

        // derive leader from county totals (sum by party; multiple candidates per party collapse to one bucket)
        const statefp = STATEFP_BY_USPS?.[usps] || null;
        if (!statefp) continue;

        const tallies = { DEM:0, REP:0, IND:0 };
        for (const [fips, row] of Object.entries(countyData || {})) {
          if (String(fips).length !== 5 || !String(fips).startsWith(statefp)) continue;
          const cs = Array.isArray(row.candidates) ? row.candidates : [];
          for (const c of cs){
            const P = normalizeParty(c.party);
            const v = Number(c.votes || c.VoteCount || 0);
            if (!Number.isFinite(v)) continue;
            tallies[P] = (tallies[P] || 0) + v;
          }
        }

        // who leads?
        const entries = Object.entries(tallies);
        let leader = null, max = -1;
        for (const [p,v] of entries){
          if (v > max){ max = v; leader = p; }
          else if (v === max){ leader = null; } // tie → no leader
        }
        if (leader) out[leader] += 1;
      }
      return out;
    }

    function transferCD(party, max, getter, setter){
      // getter() → { dem, rep }, setter(dem, rep) mutates + updates UI/EV/hatch outside
      let { dem, rep } = getter();
      const sum = dem + rep;

      if (party === 'DEM'){
        if (sum < max){ dem += 1; }
        else if (rep > 0){ rep -= 1; dem += 1; } // steal one from REP
      } else { // REP
        if (sum < max){ rep += 1; }
        else if (dem > 0){ dem -= 1; rep += 1; } // steal one from DEM
      }

      // clamp for safety
      dem = Math.max(0, Math.min(max, dem));
      rep = Math.max(0, Math.min(max, rep));
      setter(dem, rep);
    }

    function leaderLineHTML(i, total, candidates){
      if (i !== 0) return '';
      const first  = candidates?.[0];
      const second = candidates?.[1];
      if (!first || !second) return '';

      const leadVotes = (first.votes || 0) - (second.votes || 0);
      if (leadVotes <= 0) return '';

      const leadPct = total ? (100 * leadVotes / total) : 0;
      const fmt = n => Number(n || 0).toLocaleString('en-US');

      // percent or votes
      // return `<div class="leadline">${leadPct.toFixed(1)}% ${fmt(leadVotes)} AHEAD</div>`;
      return `<div class="leadline">${leadPct.toFixed(1)}% AHEAD</div>`;
    }

    function setHeaderPartWithFade(el, nextValue, { html = false, duration = 110 } = {}){
      if (!el) return;

      const nextSig = String(nextValue ?? '');

      const commit = () => {
        if (html) el.innerHTML = nextSig;
        else el.textContent = nextSig;
        el.__headerSig = nextSig;
        el.__headerPendingSig = null;
      };

      if (el.__headerSig == null) {
        commit();
        return;
      }

      if (el.__headerSig === nextSig && !el.classList.contains('is-fading')) return;
      if (el.__headerPendingSig === nextSig) return;

      el.__headerPendingSig = nextSig;
      clearTimeout(el.__headerFadeTimer);

      // hard-reset the class so every later office/year click retriggers the fade
      el.classList.remove('is-fading');
      void el.offsetWidth;

      requestAnimationFrame(() => {
        el.classList.add('is-fading');

        el.__headerFadeTimer = window.setTimeout(() => {
          commit();

          requestAnimationFrame(() => {
            el.classList.remove('is-fading');
          });
        }, duration);
      });
    }

    let LAST_HEADER_LOCATION = null;
    let PENDING_HEADER_LOCATION = null;
    let HEADER_LOCATION_TIMER = 0;

    function normalizeHeaderLocationSpec(spec = {}){
      if (spec && spec.mode === 'split') {
        return {
          mode: 'split',
          stateText: String(spec.stateText ?? ''),
          dynamicText: String(spec.dynamicText ?? ''),
          dynamicClass: String(spec.dynamicClass ?? '').trim(),
          showSep: spec.showSep !== false
        };
      }

      return {
        mode: 'plain',
        text: String(spec?.text ?? '')
      };
    }

    function renderHeaderLocation(locEl, spec){
      if (!locEl) return;

      const next = normalizeHeaderLocationSpec(spec);

      if (next.mode === 'split') {
        locEl.textContent = '';

        const stateEl = document.createElement('span');
        stateEl.className = 'loc-state';
        stateEl.textContent = next.stateText;
        locEl.appendChild(stateEl);

        if (next.showSep) {
          const sepEl = document.createElement('span');
          sepEl.className = 'loc-sep';
          sepEl.setAttribute('aria-hidden', 'true');
          sepEl.textContent = '|';
          locEl.appendChild(sepEl);
        }

        const dynamicEl = document.createElement('span');
        dynamicEl.className = next.dynamicClass ? `loc-dynamic ${next.dynamicClass}` : 'loc-dynamic';
        dynamicEl.textContent = next.dynamicText;
        locEl.appendChild(dynamicEl);
        return;
      }

      locEl.textContent = next.text;
    }

    function setHeaderLocationWithFade(spec, duration = 110){
      const locEl = document.getElementById('headerLocation');
      if (!locEl) return;

      const next = normalizeHeaderLocationSpec(spec);
      const nextSig = JSON.stringify(next);
      const lastSig = LAST_HEADER_LOCATION ? JSON.stringify(LAST_HEADER_LOCATION) : null;
      const pendingSig = PENDING_HEADER_LOCATION ? JSON.stringify(PENDING_HEADER_LOCATION) : null;

      const commitPlain = () => {
        renderHeaderLocation(locEl, next);
        LAST_HEADER_LOCATION = next;
        PENDING_HEADER_LOCATION = null;
      };

      if (LAST_HEADER_LOCATION === null) {
        commitPlain();
        return;
      }

      if (nextSig === lastSig || nextSig === pendingSig) return;

      clearTimeout(HEADER_LOCATION_TIMER);
      PENDING_HEADER_LOCATION = next;

      const plainToSplitSameState =
        LAST_HEADER_LOCATION.mode === 'plain' &&
        next.mode === 'split' &&
        String(LAST_HEADER_LOCATION.text || '').trim().toUpperCase() ===
          String(next.stateText || '').trim().toUpperCase();

      const splitToPlainSameState =
        LAST_HEADER_LOCATION.mode === 'split' &&
        next.mode === 'plain' &&
        String(LAST_HEADER_LOCATION.stateText || '').trim().toUpperCase() ===
          String(next.text || '').trim().toUpperCase();

      if (plainToSplitSameState) {
        locEl.classList.remove('is-fading');
        locEl.textContent = '';

        const stateEl = document.createElement('span');
        stateEl.className = 'loc-state';
        stateEl.textContent = next.stateText;
        locEl.appendChild(stateEl);

        let sepEl = null;
        if (next.showSep) {
          sepEl = document.createElement('span');
          sepEl.className = 'loc-sep is-fading';
          sepEl.setAttribute('aria-hidden', 'true');
          sepEl.textContent = '|';
          locEl.appendChild(sepEl);
        }

        const dynamicEl = document.createElement('span');
        dynamicEl.className = next.dynamicClass
          ? `loc-dynamic ${next.dynamicClass} is-fading`
          : 'loc-dynamic is-fading';
        dynamicEl.textContent = next.dynamicText;
        locEl.appendChild(dynamicEl);

        LAST_HEADER_LOCATION = next;
        PENDING_HEADER_LOCATION = null;

        requestAnimationFrame(() => {
          sepEl?.classList.remove('is-fading');
          dynamicEl.classList.remove('is-fading');
        });
        return;
      }

      if (splitToPlainSameState) {
        locEl.classList.remove('is-fading');

        const sepEl = locEl.querySelector('.loc-sep');
        const dynamicEl = locEl.querySelector('.loc-dynamic');

        if (!dynamicEl) {
          commitPlain();
          return;
        }

        if (sepEl) sepEl.classList.add('is-fading');
        dynamicEl.classList.add('is-fading');

        HEADER_LOCATION_TIMER = window.setTimeout(() => {
          commitPlain();
        }, duration);
        return;
      }

      if (LAST_HEADER_LOCATION.mode === 'split' && next.mode === 'split') {
        const stateEl = locEl.querySelector('.loc-state');
        const sepEl = locEl.querySelector('.loc-sep');
        const dynamicEl = locEl.querySelector('.loc-dynamic');

        if (!stateEl || !dynamicEl) {
          commitPlain();
          return;
        }

        const stateChanged = LAST_HEADER_LOCATION.stateText !== next.stateText;
        const dynamicChanged =
          LAST_HEADER_LOCATION.dynamicText !== next.dynamicText ||
          LAST_HEADER_LOCATION.dynamicClass !== next.dynamicClass;
        const sepChanged = Boolean(LAST_HEADER_LOCATION.showSep) !== Boolean(next.showSep);

        if (!stateChanged && !dynamicChanged && !sepChanged) {
          LAST_HEADER_LOCATION = next;
          PENDING_HEADER_LOCATION = null;
          return;
        }

        if (stateChanged) stateEl.classList.add('is-fading');
        if (dynamicChanged) dynamicEl.classList.add('is-fading');
        if (sepChanged && sepEl) sepEl.classList.add('is-fading');

        HEADER_LOCATION_TIMER = window.setTimeout(() => {
          let activeSepEl = locEl.querySelector('.loc-sep');

          if (stateChanged) stateEl.textContent = next.stateText;

          if (sepChanged) {
            if (next.showSep) {
              if (!activeSepEl) {
                activeSepEl = document.createElement('span');
                activeSepEl.className = 'loc-sep';
                activeSepEl.setAttribute('aria-hidden', 'true');
                activeSepEl.textContent = '|';
                locEl.insertBefore(activeSepEl, dynamicEl);
              }
            } else if (activeSepEl) {
              activeSepEl.remove();
              activeSepEl = null;
            }
          }

          if (dynamicChanged) {
            dynamicEl.className = next.dynamicClass ? `loc-dynamic ${next.dynamicClass}` : 'loc-dynamic';
            dynamicEl.textContent = next.dynamicText;
          }

          LAST_HEADER_LOCATION = next;
          PENDING_HEADER_LOCATION = null;

          requestAnimationFrame(() => {
            stateEl.classList.remove('is-fading');
            dynamicEl.classList.remove('is-fading');
            activeSepEl?.classList.remove('is-fading');
          });
        }, duration);
        return;
      }

      locEl.classList.add('is-fading');

      HEADER_LOCATION_TIMER = window.setTimeout(() => {
        commitPlain();
        requestAnimationFrame(() => locEl.classList.remove('is-fading'));
      }, duration);
    }

    function getDistrictCall(did){
      const r = Object.values(countyData || {}).find(x => x && x.district_id === did);
      if (!r) return { status:null, winnerName:null, winnerParty:null, hasWinnerFlag:false };

      const status = r.race_call_status || r.RaceCallStatus || null;
      let winnerName  = r.race_called_winner_name || null;
      let winnerParty = r.race_called_winner_party || null;
      winnerParty = winnerParty ? String(winnerParty).toUpperCase() : null;

      // Only fall back to a candidate-level flag if the race is CALLED
      // and the row-level winner fields are missing.
      if (isRaceCalled(status) && (!winnerParty || !winnerName) && Array.isArray(r.candidates)) {
        const w = r.candidates.find(c => c && (c.winner === true || String(c.Winner||'').toUpperCase()==='X'));
        if (w) {
          if (!winnerName)  winnerName  = w.name || null;
          if (!winnerParty) winnerParty = String(w.party || '').toUpperCase() || null;
        }
      }

      // "Called" is decided by status, not by candidate flags.
      const hasWinnerFlag = isRaceCalled(status) && !!winnerParty;
      return { status, winnerName, winnerParty, hasWinnerFlag };
    }

          FIRST_IMG_ERROR_LOGGED = true;
        } else {
          ev.stopImmediatePropagation();

        const party = (img.dataset?.party || 'IND').toUpperCase();
        try { swapOnce(img, imgForParty(party)); }

// Build a district id like your data rows (e.g. "4601"); coerce at-large 00 → 01
function districtIdFromFeature(d){
  const s = String(d.properties.STATEFP).padStart(2,'0');
  let n = String(
    d.properties.CD119FP ||
    d.properties.CD118FP ||
    d.properties.CD116FP ||
    d.properties.CD115FP ||
    d.id
  ).padStart(2,'0');
  if (n === '00') n = '01';    // at-large normalization
  return `${s}${n}`;
}


// Find leader party for a district row
function leaderPartyForDistrictRow(row){
  if (!row || !Array.isArray(row.candidates) || row.candidates.length === 0) return null;
  const top = [...row.candidates].sort((a,b)=>(b.votes||0)-(a.votes||0))[0];
  return top?.party || 'IND';
}

// Unified district fill used both in national view (backdrop) and inside a drilled state
// options: { insideSelected: boolean }  → when true, respect "called → solid, else dimmed" rule
// Unified district fill used both in national view (backdrop) and inside a drilled state
// options: { insideSelected: boolean }
// Paint rule: if we have a called winner, color by that party even when total === 0 (uncontested)
function fillForDistrictFeature(d, { insideSelected=false } = {}){
  const did = districtIdFromFeature(d);
  const row = Object.values(countyData).find(x => x.district_id === did);
  if (!row) return COLOR_NO_DATA;

  const total = row.total || 0;
  const { status, winnerParty } = getDistrictCall(did);
  // Prefer the called winner’s party; fall back to the row leader if present; then IND
  const leaderParty = winnerParty || leaderPartyForDistrictRow(row) || 'IND';

  // If the race is called, always paint by winner (even when total === 0)
  if (isRaceCalled(status)) {
    return insideSelected ? partySolid(leaderParty) : partyDim(leaderParty);
  }

  // Not called yet:
  // - If there are zero votes AND not called → treat as "no data"
  if (total === 0) return COLOR_NO_DATA;

  // Normal in-progress: paint by leader (dimmed unless insideSelected + you want a different rule)
  return insideSelected ? partyDim(leaderParty) : partyDim(leaderParty);
}

async function loadElectoralVotesForYear(year){

  const liveYear = (typeof LIVE_YEAR !== "undefined" ? LIVE_YEAR : window.LIVE_YEAR);
  if (String(y) !== String(liveYear)) {

    return true;

  if (_EV_JSON_CACHE[y]) {
    EV_BY_USPS = _EV_JSON_CACHE[y].ev_by_state || EV_BY_USPS;
    EV_TOTAL   = _EV_JSON_CACHE[y].total || EV_TOTAL;
    return true;
  }

  const urls = [

    `/HistoricData/electoral-votes/${y}-ev.json`,
    `HistoricData/electoral-votes/${y}-ev.json`
  ];

  for (const url of urls){
    try{
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) continue;

      const j = await res.json();
      const ev = j?.ev_by_state;

      if (ev && typeof ev === "object") {

  return false;

          for (const c of stateCandidates) {

            const k = (c.name || "") + "|" + (c.party || "");
            tally.set(k, (tally.get(k) || 0) + votes);
            candidateVoteSum += votes;
          }

          const stateTotal = Number(row.state_total || 0) ||
            (rowFips.endsWith("000") ? (Number(row.total || 0) || 0) : 0) ||
            candidateVoteSum;
          total += stateTotal;
        }
      } else {
        for (const [key, row] of Object.entries(countyData)) {
          // Only include rows for the *current* office
          if (OFFICE === "H") {
            // district-level rows only
            if (!row.district_id) continue;
          } else {
            // P/S/G: county-level rows only (5-digit FIPS keys)
            if (String(key).length !== 5) continue;
          }

          // Optional safety: skip mismatched race types if present on the row
          if (row.raceTypeId && row.raceTypeId !== RACE) continue;
          if (row.raceType && row.raceType !== RACE) continue;

          for (const c of (row.candidates || [])) {
            const k = (c.name || "") + "|" + (c.party || "");
            tally.set(k, (tally.get(k) || 0) + (c.votes || 0));
          }
          total += (row.total || 0);
        }
      }

      const candidates = [...tally.entries()]
        .map(([k, votes]) => { const [name, party] = k.split("|"); return { name, party, votes }; })
        .sort((a,b) => b.votes - a.votes);

      return { total, candidates };
    }
    
    
    function partyLabel(p){
      const P = String(p||"IND").toUpperCase();
      if (P === "DEM") return "Democrats";
      if (P === "REP") return "Republicans";

      return P; // fall back to showing the party code (LIB, GRN, etc.)
    }

    
    
    function aggregateHouseCalledWinnersNational(){
      const counts = new Map();   // party → seats called
      const seen   = new Set();   // district_id de-dupe

      // helper: normalize various party strings to DEM/REP/IND
      const normParty = (p) => {
        const k = String(p || "").toUpperCase();
        return ({
          D:"DEM", DEM:"DEM", DEMOCRAT:"DEM",
          R:"REP", REP:"REP", REPUBLICAN:"REP",
          I:"IND", IND:"IND", INDEPENDENT:"IND"
        }[k] || k);
      };

      for (const row of Object.values(countyData || {})){
        const did = row?.district_id;
        if (!did || seen.has(did)) continue;
        seen.add(did);

        const { status, winnerParty } = getDistrictCall(did);
        if (isRaceCalled(status) && winnerParty){
          const key = normParty(winnerParty);
          counts.set(key, (counts.get(key) || 0) + 1);
        }
      }

      // --- BOP overrides (House) -----------------------------------------
      try {
        const y   = (typeof YEAR !== "undefined") ? YEAR : new Date().getFullYear();
        const key = `${y}|H`;
        const off = (BOP_OFFSETS || {})[key];

        // (Optional) console log for debugging
        try { (window.bopLog || console.log).call(console, "[BOP] apply@called H", { key, off }); } catch {}

        if (off) {
          const before = {
            DEM: counts.get("DEM") || 0,
            REP: counts.get("REP") || 0,
            IND: counts.get("IND") || 0
          };

          const after = {
            DEM: Math.max(0, before.DEM + Number(off.DEM || 0)),
            REP: Math.max(0, before.REP + Number(off.REP || 0)),
            IND: Math.max(0, before.IND + Number(off.IND || 0))
          };

          counts.set("DEM", after.DEM);
          counts.set("REP", after.REP);
          counts.set("IND", after.IND);

          try { (window.bopLog || console.log).call(console, "[BOP] called deltas", { before, off, after }); } catch {}
        }
      } catch(e){ /* keep UI resilient */ }

      // return sorted array of { party, label, count }
      return Array.from(counts.entries())
        .map(([party, count]) => ({ party, label: partyLabel(party), count }))
        .sort((a,b) => b.count - a.count);
    }

    function clampLeftPanelToTwoCards(){
      const panel = document.querySelector('.left-panel .body');
      if (!panel) return;

    function setPanelHTML(html, opts = {}){
      const el = document.getElementById('countyInfo');
      const body = document.querySelector('.left-panel .body');
      if (!el) return;

      const immediate = !!opts.immediate;
      const token = ++LEFT_PANEL_SWAP_TOKEN;

      const finalize = () => {
        if (body) {
          body.style.minHeight = '';
          LEFT_PANEL_SWAP_MIN_H = '';
        }
        try { clampLeftPanelToTwoCards?.(); } catch {}
        try { syncSideLogoVisibility?.(); } catch {}
        try { updateLeftPanelVisibility?.(); } catch {}
        try { syncGaugeCandidateCards?.(); } catch {}
      };

      if (immediate) {
        el.classList.remove('panel-swap-out', 'panel-swap-in');
        if (body) {
          body.classList.remove('panel-swap-lock');
          body.style.minHeight = '';
          LEFT_PANEL_SWAP_MIN_H = '';
        }
        el.innerHTML = html || '';
        requestAnimationFrame(finalize);
        return;
      }

      el.classList.remove('panel-swap-in');
      el.classList.add('panel-swap-out');

      if (body) {
        LEFT_PANEL_SWAP_MIN_H = `${body.offsetHeight}px`;
        body.style.minHeight = LEFT_PANEL_SWAP_MIN_H;
        body.classList.add('panel-swap-lock');
      }

      setTimeout(() => {
        if (token !== LEFT_PANEL_SWAP_TOKEN) return;
        el.innerHTML = html || '';

        requestAnimationFrame(() => {
          if (token !== LEFT_PANEL_SWAP_TOKEN) return;
          el.classList.remove('panel-swap-out');
          el.classList.add('panel-swap-in');
          if (body) body.classList.remove('panel-swap-lock');
          finalize();

          setTimeout(() => {
            if (token !== LEFT_PANEL_SWAP_TOKEN) return;
            el.classList.remove('panel-swap-in');
          }, 180);
        });
      }, 90);
    }

  const stateGeoms    = stTopo.objects.states.geometries;
  const neighborLists = topojson.neighbors(stateGeoms); // arrays of geometry-index neighbors
  const idByIdx = stateGeoms.map(g => g.id);
  const idxById = new Map(idByIdx.map((id,i)=>[id,i]));

  function adjacentStateIdsOf(id, hops = 1){
    const seen = new Set([id]);
    let frontier = [id];
    for (let h = 0; h < hops; h++){
      const next = [];
      for (const cur of frontier){
        const idx = idxById.get(cur);
        if (idx == null) continue;
        for (const j of neighborLists[idx]){
          const nid = idByIdx[j];
          if (!seen.has(nid)){ seen.add(nid); next.push(nid); }
        }
      }
      frontier = next;
    }
    seen.delete(id);
    return Array.from(seen);
  }

  function animateCountyReveal(paths, stateFeature){
  if (!COUNTY_REVEAL.enabled || !paths || paths.empty()) return;

  let cx = 0, cy = 0;

  if (stateFeature) {
    const c = path.centroid(stateFeature);
    cx = c[0];
    cy = c[1];
  }

  const items = [];
  paths.each(function(d, i){
    const c = path.centroid(d);
    const dx = c[0] - cx;
    const dy = c[1] - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    items.push({ node: this, d, i, dist });
  });

  const maxDist = d3.max(items, x => x.dist) || 1;

  paths
    .interrupt()
    .style("opacity", COUNTY_REVEAL.startOpacity)
    .attr("transform", function(d){
      const c = path.centroid(d);
      return `translate(${c[0]},${c[1]}) scale(${COUNTY_REVEAL.startScale}) translate(${-c[0]},${-c[1]})`;
    });

  d3.selectAll(items.map(x => x.node))
    .transition("county-reveal")
    .delay(function(_, i){
      const item = items[i];
      if (COUNTY_REVEAL.mode === "sequence") {
        return (i / Math.max(1, items.length - 1)) * COUNTY_REVEAL.maxDelayMs;
      }
      return (item.dist / maxDist) * COUNTY_REVEAL.maxDelayMs;
    })
    .duration(COUNTY_REVEAL.durationMs)
    .ease(d3.easeCubicOut)
    .style("opacity", COUNTY_REVEAL.endOpacity)
    .attr("transform", null)
}

  function inferPartyNamesForState(usps){
    try {
      const rows = Object.values(countyData || {}).filter(
        r => String(r.state || '').toUpperCase() === String(usps).toUpperCase()
      );

      // 1) Prefer state_topline (often present)
      let dem = null, rep = null;
      for (const r of rows) {
        const topline = Array.isArray(r.state_topline) ? r.state_topline : [];
        for (const c of topline) {
          const p = (typeof normalizeParty === 'function')
            ? normalizeParty(c.party || '')
            : String(c.party || '').toUpperCase();
          if (p === 'DEM' && !dem) dem = c.name || dem;
          if (p === 'REP' && !rep) rep = c.name || rep;
        }
        if (dem && rep) break;
      }

      // 2) Fallback: sum county-level candidate votes by party and pick top name
      if (!(dem && rep)) {
        const acc = { DEM: new Map(), REP: new Map() };
        for (const r of rows) {
          const cs = Array.isArray(r.candidates) ? r.candidates : [];
          for (const c of cs) {
            const p = (typeof normalizeParty === 'function')
              ? normalizeParty(c.party || '')
              : String(c.party || '').toUpperCase();
            if (p !== 'DEM' && p !== 'REP') continue;
            const nm = c.name || '';
            const v  = Number(c.votes || 0) || 0;
            if (!nm) continue;
            const m = acc[p];
            m.set(nm, (m.get(nm) || 0) + v);
          }
        }
        if (!dem && acc.DEM.size) dem = [...acc.DEM.entries()].sort((a,b)=>b[1]-a[1])[0][0];
        if (!rep && acc.REP.size) rep = [...acc.REP.entries()].sort((a,b)=>b[1]-a[1])[0][0];
      }

      return { dem_name: dem || null, rep_name: rep || null };
    } catch {
      return { dem_name: null, rep_name: null };
    }
  }

    // Parse one state's historic XML into rows compatible with countyData

    // Parse one state's historic XML into rows compatible with countyData
    function parseHistoricCountyXML(xmlText) {
      const doc = new DOMParser().parseFromString(xmlText, "application/xml");

      // Support either schema:
      // (a) <ElectionResults ...> ... <ReportingUnit ...>
      // (b) <Vote><Race OfficeID="G" TypeID="G" ...> ... <ReportingUnit ...>
      const rootER   = doc.querySelector("ElectionResults");
      const rootRace = rootER ? null : (doc.querySelector("Vote > Race") || doc.querySelector("Race"));

      // Pull office/raceType/statePostal from whatever root we have
      let office = "", raceType = "", statePostal = "";
      if (rootER) {
        office      = rootER.getAttribute("Office") || "";
        raceType    = rootER.getAttribute("RaceTypeID") || "";
        statePostal = rootER.getAttribute("StatePostal") || "";
      } else if (rootRace) {
        office   = rootRace.getAttribute("OfficeID") || rootRace.getAttribute("Office") || "";
        raceType = rootRace.getAttribute("TypeID")   || rootRace.getAttribute("RaceTypeID") || "";

        // best source for state postal in v3 is the statewide RU
        const ruState = doc.querySelector('ReportingUnit[Level="state"], ReportingUnit[ReportingUnitLevel="1"]');
        statePostal = (ruState && (ruState.getAttribute("StatePostal") || "")) || "";
      } else {
        // Unknown schema
        return [];
      }

      const rows = [];

      // RU tag names we’ve seen across dumps
      doc.querySelectorAll("ReportingUnit, County, RU").forEach(ru => {
        // In v3 files, skip the statewide RU; keep counties/subunits only
        const lvlRaw = (ru.getAttribute("Level") || ru.getAttribute("ReportingUnitLevel") || "").toString().toLowerCase();
        if (rootRace && (lvlRaw === "state" || lvlRaw === "1")) return;

        const name = ru.getAttribute("Name") || "";

        // --- FIPS normalization ---
        // Many variants: FIPS, Fips, FIPSCode, CountyFIPS, etc.
        const rawFipsAny =
          ru.getAttribute("FIPS")       || ru.getAttribute("Fips")      ||
          ru.getAttribute("FIPSCode")   || ru.getAttribute("FipsCode")  ||
          ru.getAttribute("FIPS5")      || ru.getAttribute("Fips5")     ||
          ru.getAttribute("CountyFIPS") || "";

        // Some feeds split state/county; look for a state FIPS too (or on ER root)
        const rawStateFips =
          ru.getAttribute("StateFIPS") || ru.getAttribute("StateFips") || ru.getAttribute("StateFP") ||
          (rootER && (rootER.getAttribute("StateFIPS") || rootER.getAttribute("StateFP"))) || "";

        const digits = String(rawFipsAny).replace(/\D/g, "");
        let fips = "";
        if (digits.length >= 5) {
          fips = digits.slice(-5); // already full 5-digit
        } else {
          const county3 = digits.slice(-3).padStart(3, "0");
          const state2  = String(rawStateFips).replace(/\D/g, "").slice(-2).padStart(2, "0");
          fips = (state2 + county3).padStart(5, "0"); // e.g., "51" + "085" -> "51085"
        }

        // Collect candidates
        const candidates = [];
        let total = 0;
        ru.querySelectorAll("Candidate").forEach(c => {
          const first = c.getAttribute("First") || "";
          const last  = c.getAttribute("Last")  || "";
          const party = c.getAttribute("Party") || "";
          const votes = parseInt(c.getAttribute("VoteCount") || "0", 10) || 0;
          candidates.push({ name: `${first} ${last}`.trim(), party, votes });
          total += votes;
        });

        // Only push real county/city rows
        if (fips && fips !== "00000") {
          rows.push({ office, raceType, state: statePostal, name, fips, candidates, total });
        }
      });

      return rows;
    }

    function parseHistoricHouseXML(xmlText, usps) {
      const statefp = STATEFP_BY_USPS[usps];
      if (!statefp) return [];

      const doc = new DOMParser().parseFromString(xmlText, "application/xml");
      const ds = [...doc.querySelectorAll("District, ReportingUnit")];
      const rows = [];

      for (const d of ds) {
        let dn = (d.getAttribute("District") || d.getAttribute("Id") || d.getAttribute("Number") || "00").padStart(2, "0");
        const nm = (d.getAttribute("Name") || "");
        if (/at[- ]?large/i.test(nm)) dn = "00";

        const district_id = statefp + dn;

        // NEW: try multiple attrs for district call status
        const dStatus = d.getAttribute("RaceCallStatus") || d.getAttribute("CallStatus") || d.getAttribute("race_call_status") || null;

        let total = 0, winnerName = null, winnerParty = null, anyWinnerFlag = false;
        const candidates = [...d.querySelectorAll("Candidate")].map(c => {
          const first = c.getAttribute("First") || "";
          const last  = c.getAttribute("Last")  || "";
          const party = c.getAttribute("Party") || "";
          const votes = parseInt(c.getAttribute("VoteCount") || "0", 10) || 0;

          // NEW: normalize winner flag(s)
          const winAttr = (c.getAttribute("Winner") || c.getAttribute("IsWinner") || "").toString().toLowerCase();
          const winner = winAttr === "x" || winAttr === "true";

          if (winner) { anyWinnerFlag = true; winnerName = `${first} ${last}`.trim(); winnerParty = party; }
          total += votes;
          return { name: `${first} ${last}`.trim(), party, votes, Winner: winner ? "X" : "", winner };
        });

        // Top candidate (fallback if needed)
        const top = candidates.slice().sort((a,b)=>b.votes-a.votes)[0];

        const row = {
          office: "H",
          raceType: "G",
          state: usps,
          name: `CD ${dn === "00" ? "At-Large" : parseInt(dn,10)}`,
          district_id,
          candidates,
          total
        };

        // NEW: propagate call + called winner only when truly called
        if (dStatus) row.race_call_status = dStatus;
        if ((dStatus && isRaceCalled(dStatus)) || anyWinnerFlag) {
          row.race_call_status = dStatus || "Called";
          row.race_called_winner_name  = winnerName || top?.name || null;
          row.race_called_winner_party = winnerParty || top?.party || null;
        }

        rows.push(row);
      }
      return rows;
    }

    // collapse a row’s votes to party buckets then margin (DEM-REP)/total in % points
    function rowMarginPctPoints(row){
      if (!row) return null;
      const tally = { DEM:0, REP:0 };
      const total = Number(row.total || 0);
      for (const c of (row.candidates || [])){
        const P = normalizeParty(c.party);
        const v = Number(c.votes || 0);
        if (!Number.isFinite(v) || v <= 0) continue;
        if (P === 'DEM' || P === 'REP') tally[P] += v;
      }
      if (total <= 0) return null;
      return 100 * (tally.DEM - tally.REP) / total;
    }

    // build county + state margin maps from a rows map {fips -> row}
    function buildMarginMaps(rowsMap){
      const countyMargins = Object.create(null);
      const stateTotals = Object.create(null);  // statefp -> {DEM, REP, total}
      for (const [fips, r] of Object.entries(rowsMap || {})){
        if (!/^\d{5}$/.test(fips)) continue;
        const m = rowMarginPctPoints(r);
        if (m != null) countyMargins[fips] = m;

        const fp2 = fips.slice(0,2);
        const agg = (stateTotals[fp2] ||= {DEM:0, REP:0, total:0});
        for (const c of (r.candidates || [])){
          const P = normalizeParty(c.party);
          const v = Number(c.votes || 0);
          if (!Number.isFinite(v) || v <= 0) continue;
          if (P === 'DEM') agg.DEM += v;
          else if (P === 'REP') agg.REP += v;
        }
        agg.total += Number(r.total || 0);
      }
      const stateMargins = Object.create(null);
      for (const [fp2, a] of Object.entries(stateTotals)){
        stateMargins[fp2] = (a.total > 0) ? 100 * (a.DEM - a.REP) / a.total : null;
      }
      return { countyMargins, stateMargins };
    }

          } else {

          }

          updateActiveBadge();

          return; // IMPORTANT: skip national reset
        }

        // 🚩 Stay-zoomed across years for H districts (district view only)
        if (OFFICE === "H" && selectedDistrict && NAV_LEVEL === 2) {
          // Make sure we're on the right live/historic polling
          if (isLiveContext()) startLivePolling(); else stopLivePolling();

          // Ensure district geometries for this year are loaded
          await loadDistrictMapForYear(YEAR);
          drawShapes();

          // Refresh data for this year/office/race and repaint

          const statefp = selectedDistrict.slice(0, 2);

          renderDistrictPanel(selectedDistrict);

          return; // IMPORTANT: skip national reset
        }

        // normal path (no stay-zoomed)

        }

        countyData = {};

        updateActiveBadge();

        const goingNational = (NAV_LEVEL === 0 && !selectedStateFP && !selectedFips && !selectedDistrict);
        if (!goingNational) {
          if (isLiveContext()) {
            startLivePolling();
            getDataFromCache();
          } else {

            getDataFromCache(); // historic branch
          }
        }
        
        // Default path: national view (no drill-in) → fetch + repaint, like the race/office handler
        if (NAV_LEVEL === 0 && !selectedStateFP && !selectedFips && !selectedDistrict) {

          // For House 2026 national (district backdrop), make sure geometry is loaded
          if (OFFICE === "H") {

          // Clear old rows and load the new context

          // Rebuild shapes + paint + national panel
          drawShapes();

          updateLeftPanelVisibility?.();
          syncPercentBolt?.();

          // Live vs historic polling behavior
          if (isLiveContext()) startLivePolling?.();
          else                 stopLivePolling?.();

          return;
        }

      };

    function fillForFeature(d){

            if (!r || isNoData(r)) return COLOR_NO_DATA;
            if ((r.total || 0) === 0) return COLOR_NO_DATA;

            const lead = (top?.party || "IND").toUpperCase();
            return lead === "REP" ? COLOR_GOP_LIGHT :
                   lead === "DEM" ? COLOR_DEM_LIGHT : COLOR_IND_LIGHT;

          const lead = r.candidates.slice().sort((a,b)=>b.votes-a.votes)[0].party;
          const base =
              lead === "REP" ? COLOR_GOP :
              lead === "DEM" ? COLOR_DEM : COLOR_IND;

          if (selectedDistrict && did !== selectedDistrict) {
            return lead === "REP" ? COLOR_GOP_LIGHT :
                   lead === "DEM" ? COLOR_DEM_LIGHT : COLOR_IND_LIGHT;
          }
          return base;
        }

        else {
        // === P / S / G county coloring ===
        // === P / S / G county coloring ===
        // M 2025: in New York, grey out *all* counties except the 5 NYC boroughs
        if (OFFICE === 'M' && (String(YEAR) === '2025' || String(YEAR) === '2021')) {
          const f = String(d.id).padStart(5,'0');
          const statefp = f.slice(0,2);
          const usps = USPS_BY_STATEFP?.[statefp];
          if (usps === 'NY' && !NYC_BOROUGH_FIPS.has(f)) {

        const f = String(d.id).padStart(5, "0");

        if (shiftIsActive()) {
          const base = SHIFT_BASE_2021[f];
          const live = SHIFT_LIVE_2025[f];
          if (base != null && live != null) {
            const delta = live - base;           // + = bluer than 2021, - = redder
            return colorForShift(delta);
          }
          // no baseline/live → fall through to normal coloring
        }
        const isLive = (String(YEAR) === String(LIVE_YEAR));

                const isLiveSG = isLive && NAV_LEVEL >= 1 && (OFFICE === "S" || OFFICE === "G");

                


        const r = countyData[f];

        if (OFFICE === "S" && String(YEAR) === "2026" && NAV_LEVEL >= 1) {

            USPS_BY_STATEFP?.[String(selectedStateFP).padStart(2,"0")] || null;
          const usps = r.state || USPS_BY_STATEFP?.[f.slice(0,2)];

          // Grey counties only if they belong to a *different* state that has no race
          if (usps && usps !== selectedUSPS && isNoSenate2026(usps)) {
            return NO_RACE_GREY;
          }
        }


        // If no candidate rows or zero votes, keep your existing greys
        if (!r.candidates?.length) return isLiveSG ? COLOR_NO_DATA : COLOR_BG;
        if ((r.total || 0) === 0) return COLOR_NO_DATA;

        // Normal county coloring (winner/leader)
        const leadRaw = r.candidates.slice().sort((a,b)=>b.votes-a.votes)[0].party;
        const lead = normalizeParty(leadRaw);
        let base =
          lead === "REP" ? COLOR_GOP :
          lead === "DEM" ? COLOR_DEM : COLOR_IND;


        // Dim neighbors when drilled into a single county
        if (["P","S","G","A","M"].includes(OFFICE) && NAV_LEVEL === 2 && selectedFips) {
          const statefp = selectedFips.slice(0,2);

    function colorizeInstant(force = false){
      if (!force && IS_ZOOMING) { PAINT_DEFERRED = true; return; }

      // H national view: repaint districts using call-aware national logic
      if (OFFICE === "H" && NAV_LEVEL === 0) {
        const total = districtShapes?.length || 0;
        let painted = 0;
        (districtsSel || countyLayer.selectAll("path.district"))
          .attr("fill", d => {
            const fill = fillForFeature(d); // national H logic is inside fillForFeature()
            if (fill !== COLOR_BG) painted++;
            return fill;
          });
        paintEl.textContent = `paint ${painted}/${total}`;
        return;
      }

      // P/S/G national states repaint (or any other 'states' geom case that isn’t House)
      if (CURRENT_GEOM === 'states' && OFFICE !== 'H') {
        const total = statesFeatures ? statesFeatures.length : 0;
        let painted = 0;

        statesSel.attr("fill", d => {
          const usps = d.usps || d.properties?.usps || d.properties?.STUSPS || USPS_BY_STATEFP?.[String(d.id).padStart(2,"0")];

          // Use the correct helper name
          if (typeof isNoRace2026 === "function" && isNoRace2026(usps)) {
            if (NO_RACE_GREY !== COLOR_BG) painted++;
            return NO_RACE_GREY;
          }
           if (String(YEAR) === '0') {
             if (OFFICE === 'M' && !hasMayor2021(usps)) { painted++; return NO_RACE_GREY; }
             if (OFFICE === 'A' && !hasAG2021(usps))     { painted++; return NO_RACE_GREY; }
             if (OFFICE === 'G' && !hasGOV2021(usps))    { painted++; return NO_RACE_GREY; }
           }
          const fill = fillForState(d);
          if (fill !== COLOR_BG) painted++;
          return fill;
        });

        paintEl.textContent = `paint ${painted}/${total}`;
        return;
      }

      // Fallback: drilled-in views (districts or counties)
      const isHouse = (OFFICE === "H");
      const total = isHouse ? (districtShapes?.length || 0) : (countyShapes?.length || 0);
      let painted = 0;

      const sel = isHouse
         ? (districtsSel || countyLayer.selectAll("path.district"))
         : (countiesSel  || countyLayer.selectAll("path.county"));

      sel
        ?.attr("fill", d => {
          // If we drilled into an S/2026 no-race state, paint all counties grey
          if (window.NO_RACE_VIEW === true) return NO_RACE_GREY;

          // In NAV_LEVEL=2 (district selected), only the selected district is "insideSelected".
          // Everyone else should use the dim palette.
          const insideSelected =
            !(isHouse && NAV_LEVEL === 2 && selectedDistrict) ||
            (typeof districtIdFromFeature === "function" &&
             String(districtIdFromFeature(d)) === String(selectedDistrict));

          const fill = (isHouse && NAV_LEVEL >= 1)
            ? fillForDistrictFeature(d, { insideSelected })
            : fillForFeature(d);
          if (fill !== COLOR_BG) painted++;
          return fill;
        })
        .classed("no-race", d => {
          if (isHouse) return false;
          const f = String(d.id).padStart(5,"0");
          const usps = (countyData[f]?.state) || USPS_BY_STATEFP?.[f.slice(0,2)];
          return (
              YEAR === "2026" &&
              ((OFFICE === "S" && isNoSenate2026(usps)) ||
               (OFFICE === "G" && isNoGovernor2026(usps)))
            );
        });

      paintEl.textContent = `paint ${painted}/${total}`;

      // STATE VIEW backdrop tinting for S 2026:
      // Grey the selected no-race state AND any other no-race states.
      if (NAV_LEVEL >= 1 && OFFICE === 'S' && String(YEAR) === '2026' && statesSel) {
        const selectedUSPS =
          USPS_BY_STATEFP?.[String(selectedStateFP).padStart(2,"0")] || null;

        statesSel
          .attr('fill', d => {
            const usps =
              d.usps ||
              d.properties?.usps ||
              d.properties?.STUSPS ||
              USPS_BY_STATEFP?.[String(d.id).padStart(2,"0")];

            // Grey the selected state if it has no race
            if (usps && usps === selectedUSPS && isNoSenate2026(usps)) {
              return NO_RACE_GREY;
            }
            // Grey other states with no race
            if (usps && usps !== selectedUSPS && isNoSenate2026(usps)) {
              return NO_RACE_GREY;
            }
            // Otherwise leave normal backdrop
            return fillForState?.(d) ?? COLOR_BG;
          })
          .classed('no-race', d => {
            const usps =
              d.usps ||
              d.properties?.usps ||
              d.properties?.STUSPS ||
              USPS_BY_STATEFP?.[String(d.id).padStart(2,"0")];
            return !!usps && isNoSenate2026(usps);
          });
      }
      if (NAV_LEVEL >= 1 && (OFFICE === 'G' || OFFICE === 'A' || OFFICE === 'M') && String(YEAR) === '2025' && statesSel) {
        const selectedUSPS = USPS_BY_STATEFP?.[String(selectedStateFP).padStart(2,"0")] || null;
        statesSel
          .attr('fill', d => {
            const usps =
              d.usps || d.properties?.usps || d.properties?.STUSPS ||
              USPS_BY_STATEFP?.[String(d.id).padStart(2,"0")];
              if (usps && !hasLiveState2025(usps)) return NO_RACE_GREY;
            return fillForState?.(d) ?? COLOR_BG;
          })
          .classed('no-race', d => {
            const usps =
              d.usps || d.properties?.usps || d.properties?.STUSPS ||
              USPS_BY_STATEFP?.[String(d.id).padStart(2,"0")];
            return !!usps && isNoGovernor2026(usps);
          });
      }
      // Neighbor overlays (unchanged)
      if (["P","S","G"].includes(OFFICE) &&
          selectedStateFP && NAV_LEVEL >= 1 &&
          typeof window.drawNeighborStatesOverlay === "function") {
        const sd = statesFeatures?.find(s => String(s.id).padStart(2, "0") === selectedStateFP);
        if (sd) window.drawNeighborStatesOverlay(sd);
      }
      if (OFFICE === "H" &&
          selectedStateFP && NAV_LEVEL >= 1 &&
          typeof window.drawNeighborDistrictsOverlay === "function") {
        const sd = statesFeatures?.find(s => String(s.id).padStart(2, "0") === selectedStateFP);
        if (sd) window.drawNeighborDistrictsOverlay(sd);
      }
    }
