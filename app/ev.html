<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>EV Checker</title>
  <style>
    :root{
      --bg:#0b1020;
      --panel:#101a33;
      --fg:#e9eefc;
      --muted:#9fb3d1;
      --ok:#33d17a;
      --warn:#ffb86c;
      --bad:#ff5c5c;
      --dem:#2a64ff;
      --rep:#e23b3b;
      --other:#8e44ad;
      --row:#0f1833;
      --border:rgba(255,255,255,.12);
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 800px at 20% 10%, #15224a 0%, var(--bg) 55%, #060a18 100%);
      color:var(--fg);
    }
    .wrap{
      max-width: 980px;
      margin: 22px auto;
      padding: 0 14px 24px;
    }
    .top{
      display:flex;
      gap:14px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    h1{
      margin:0;
      font-size: 18px;
      letter-spacing:.2px;
      font-weight: 650;
    }
    .sub{
      margin-top:6px;
      color:var(--muted);
      font-size: 12px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      background: rgba(255,255,255,.04);
      box-shadow: var(--shadow);
    }
    .dot{width:8px;height:8px;border-radius:999px;background:var(--muted)}
    .card{
      margin-top:14px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow: var(--shadow);
    }
    .bar{
      height: 18px;
      border-radius: 999px;
      overflow:hidden;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
    }
    .seg{height:100%; display:inline-block;}
    .seg.dem{background:var(--dem)}
    .seg.rep{background:var(--rep)}
    .seg.other{background:var(--other)}
    .seg.uncalled{background:rgba(255,255,255,.12)}
    .legend{
      display:flex; gap:12px; flex-wrap:wrap;
      margin-top:10px;
      color:var(--muted);
      font-size:12px;
    }
    .lg{
      display:inline-flex; align-items:center; gap:7px;
    }
    .sw{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.2)}
    .sw.dem{background:var(--dem)}
    .sw.rep{background:var(--rep)}
    .sw.other{background:var(--other)}
    .sw.uncalled{background:rgba(255,255,255,.18)}
    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      margin-top:12px;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.03);
    }
    thead th{
      text-align:left;
      font-size:12px;
      color:var(--muted);
      padding:10px 10px;
      border-bottom:1px solid var(--border);
      background: rgba(0,0,0,.12);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tbody td{
      padding: 9px 10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-size: 13px;
      background: rgba(255,255,255,.01);
    }
    tbody tr:nth-child(2n) td{ background: rgba(255,255,255,.02); }
    tbody tr:last-child td{ border-bottom:none; }
    .state{font-weight:650; letter-spacing:.3px}
    .ev{color:var(--muted); font-variant-numeric: tabular-nums;}
    .party{
      font-weight:650;
      letter-spacing:.2px;
    }
    .party.dem{color:var(--dem)}
    .party.rep{color:var(--rep)}
    .party.other{color:var(--other)}
    .party.uncalled{color:rgba(255,255,255,.7)}
    .mini{
      display:inline-flex; align-items:center; gap:8px;
      font-size:12px; color:var(--muted);
      margin-top:10px;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: rgba(255,255,255,.85);
    }
    .err{
      margin-top:10px;
      color: var(--bad);
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Electoral Vote Checker</h1>
        <div class="sub">
          Pulls state call status from the hub (no direct file reads). Default: <span class="kbd">office=P</span>, <span class="kbd">raceTypeId=G</span>.
          You can override with <span class="kbd">?raceTypeId=G</span> or <span class="kbd">?raceTypeId=D</span>/<span class="kbd">R</span>.
        </div>
      </div>
      <div class="pill">
        <span class="dot" id="dot"></span>
        <span id="status">idle</span>
      </div>
    </div>

    <div class="card">
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
      <div class="mini" id="meta"></div>

      <table>
        <thead>
          <tr>
            <th style="width:72px;">State</th>
            <th style="width:55px;">EV</th>
            <th style="width:140px;">Call status</th>
            <th style="width:90px;">Winner</th>
            <th>Winner name</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="err" id="err"></div>
    </div>
  </div>

<script>
/* EV counts (2024/2028-style allocation: 538 total).
   If you ever change EVs in your main app, update this map so this checker matches. */
const EV_BY_USPS = {
  "AL":9,"AK":3,"AZ":11,"AR":6,"CA":54,"CO":10,"CT":7,"DE":3,"DC":3,"FL":30,"GA":16,"HI":4,"ID":4,"IL":19,"IN":11,"IA":6,"KS":6,
  "KY":8,"LA":8,"ME":4,"MD":10,"MA":11,"MI":15,"MN":10,"MS":6,"MO":10,"MT":4,"NE":5,"NV":6,"NH":4,"NJ":14,"NM":5,"NY":28,
  "NC":16,"ND":3,"OH":17,"OK":7,"OR":8,"PA":19,"RI":4,"SC":9,"SD":3,"TN":11,"TX":40,"UT":6,"VT":3,"VA":13,"WA":12,
  "WV":4,"WI":10,"WY":3
};

function qs(k){ return new URLSearchParams(location.search).get(k); }
function byState(a,b){ return a < b ? -1 : (a > b ? 1 : 0); }

function pill(text, kind){
  const c = document.createElement("span");
  c.className = "pill";
  c.style.boxShadow = "none";
  c.style.background = "rgba(255,255,255,.03)";
  c.style.borderColor = "rgba(255,255,255,.10)";
  c.style.padding = "4px 9px";
  c.style.fontSize = "11px";
  c.style.color = (kind==="ok") ? "rgba(255,255,255,.92)"
            : (kind==="warn") ? "rgba(255,255,255,.92)"
            : (kind==="bad") ? "rgba(255,255,255,.92)"
            : "rgba(255,255,255,.80)";
  const d = document.createElement("span");
  d.className = "dot";
  d.style.width = "7px";
  d.style.height = "7px";
  d.style.background = (kind==="ok") ? "var(--ok)"
               : (kind==="warn") ? "var(--warn)"
               : (kind==="bad") ? "var(--bad)"
               : "rgba(255,255,255,.35)";
  c.appendChild(d);
  c.appendChild(document.createTextNode(text));
  return c;
}

async function getJSON(url){
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error(`fetch ${url} -> ${res.status}`);
  return res.json();
}

function dataURL(){
  const office = "P";
  const raceTypeId = (qs("raceTypeId") || "G").toUpperCase();
  // Primary parties use the flattened primary cache endpoint in your hub
  if (raceTypeId === "D" || raceTypeId === "R"){
    return `/primary_cache/ru?office=${office}&raceTypeId=${encodeURIComponent(raceTypeId)}`;
  }
  return `/cache/ru?office=${office}&raceTypeId=${encodeURIComponent(raceTypeId)}`;
}

function classifyParty(p){
  const x = (p || "").toUpperCase();
  if (x === "DEM") return "dem";
  if (x === "REP") return "rep";
  if (!x) return "uncalled";
  return "other";
}

function isCalled(status){
  const s = (status || "").toLowerCase();
  // your hub uses "No Decision" as the default; anything else we treat as called-ish
  if (!s) return false;
  if (s.includes("no decision")) return false;
  return true;
}

function fmtTS(ts){
  if (!ts) return "";
  try{
    const d = new Date(ts);
    if (isNaN(+d)) return String(ts);
    return d.toLocaleString();
  } catch { return String(ts); }
}

function renderBar(demEV, repEV, otherEV, uncalledEV){
  const total = demEV + repEV + otherEV + uncalledEV;
  const bar = document.getElementById("bar");
  bar.innerHTML = "";
  function seg(cls, v){
    const s = document.createElement("span");
    s.className = `seg ${cls}`;
    s.style.width = total ? `${(v/total)*100}%` : "0%";
    bar.appendChild(s);
  }
  seg("dem", demEV);
  seg("rep", repEV);
  seg("other", otherEV);
  seg("uncalled", uncalledEV);

  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  const items = [
    ["dem", `DEM ${demEV}`],
    ["rep", `REP ${repEV}`],
    ["other", `Other ${otherEV}`],
    ["uncalled", `Uncalled ${uncalledEV}`],
  ];
  for (const [cls, label] of items){
    const el = document.createElement("span");
    el.className = "lg";
    const sw = document.createElement("span");
    sw.className = `sw ${cls}`;
    el.appendChild(sw);
    el.appendChild(document.createTextNode(label));
    legend.appendChild(el);
  }
}

async function refresh(){
  const status = document.getElementById("status");
  const dot = document.getElementById("dot");
  const err = document.getElementById("err");
  err.textContent = "";

  try{
    status.textContent = "loading…";
    dot.style.background = "var(--warn)";

    const url = dataURL();
    const payload = await getJSON(url);
    const rows = Array.isArray(payload?.rows) ? payload.rows : [];

    // Build per-state info by sampling the first row we see per state.
    const st = {};
    let latestUpdated = null;

    for (const r of rows){
      const usps = (r?.state || "").toUpperCase();
      if (!usps) continue;
      if (!st[usps]){
        st[usps] = {
          race_call_status: r?.race_call_status || "No Decision",
          race_called_winner_party: r?.race_called_winner_party || "",
          race_called_winner_name: r?.race_called_winner_name || "",
          updated: r?.updated || null,
        };
      }
      // keep the newest timestamp we see
      const u = r?.updated || null;
      if (u && (!latestUpdated || String(u) > String(latestUpdated))) latestUpdated = u;
    }

    const evMapTotal = Object.values(EV_BY_USPS).reduce((a,b)=>a+b,0);

    let demEV=0, repEV=0, otherEV=0, uncalledEV=0;

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    const allStates = Object.keys(EV_BY_USPS).sort(byState);
    for (const usps of allStates){
      const ev = EV_BY_USPS[usps];
      const info = st[usps];

      let callStatus = "MISSING";
      let winnerParty = "";
      let winnerName = "";
      let called = false;

      if (info){
        callStatus = info.race_call_status || "No Decision";
        winnerParty = info.race_called_winner_party || "";
        winnerName = info.race_called_winner_name || "";
        called = isCalled(callStatus) && !!winnerParty;
      }

      const partyCls = classifyParty(winnerParty);
      if (!info){
        uncalledEV += ev;
      } else if (!called){
        uncalledEV += ev;
      } else if (partyCls === "dem"){
        demEV += ev;
      } else if (partyCls === "rep"){
        repEV += ev;
      } else {
        otherEV += ev;
      }

      const tr = document.createElement("tr");

      const tdS = document.createElement("td");
      tdS.className = "state";
      tdS.textContent = usps;

      const tdEV = document.createElement("td");
      tdEV.className = "ev";
      tdEV.textContent = String(ev);

      const tdCall = document.createElement("td");
      if (!info){
        tdCall.appendChild(pill("MISSING", "bad"));
      } else if (!called){
        tdCall.appendChild(pill(callStatus || "No Decision", "warn"));
      } else {
        tdCall.appendChild(pill(callStatus, "ok"));
      }

      const tdP = document.createElement("td");
      const p = document.createElement("span");
      p.className = `party ${partyCls}`;
      p.textContent = winnerParty || (info ? "—" : "");
      tdP.appendChild(p);

      const tdN = document.createElement("td");
      tdN.textContent = winnerName || "";

      tr.appendChild(tdS);
      tr.appendChild(tdEV);
      tr.appendChild(tdCall);
      tr.appendChild(tdP);
      tr.appendChild(tdN);

      tbody.appendChild(tr);
    }

    renderBar(demEV, repEV, otherEV, uncalledEV);

    const meta = document.getElementById("meta");
    meta.innerHTML = "";
    meta.appendChild(document.createTextNode("source: "));
    const k1 = document.createElement("span"); k1.className="kbd"; k1.textContent = url;
    meta.appendChild(k1);
    meta.appendChild(document.createTextNode(" • EV map total: "));
    const k2 = document.createElement("span"); k2.className="kbd"; k2.textContent = String(evMapTotal);
    meta.appendChild(k2);
    if (latestUpdated){
      meta.appendChild(document.createTextNode(" • cache updated: "));
      const k3 = document.createElement("span"); k3.className="kbd"; k3.textContent = fmtTS(latestUpdated);
      meta.appendChild(k3);
    }

    status.textContent = `ok — DEM ${demEV} • REP ${repEV} • other ${otherEV} • uncalled ${uncalledEV}`;
    dot.style.background = "var(--ok)";
  } catch (e){
    status.textContent = "error";
    dot.style.background = "var(--bad)";
    err.textContent = String(e && e.stack ? e.stack : e);
    console.error(e);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
