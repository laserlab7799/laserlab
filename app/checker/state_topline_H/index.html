<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>House 2026 Calls — From p_cache.json</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #151822;
    --text: #eaeef6;
    --muted: #94a3b8;
    --border: #232839;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
    background: linear-gradient(180deg, #121624, #0f1115);
    position: sticky; top: 0; z-index: 10;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px 32px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 14px; padding: 16px; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; word-break: break-all; }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; }
  button { background: #1f2435; color: var(--text); border: 1px solid var(--border);
           border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  button:hover { background: #242a3f; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th { text-align: left; color: var(--muted); font-weight: 600;
             padding: 10px 10px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; line-height: 18px; border: 1px solid var(--border);
    background: #1a1f2f; color: var(--muted);
  }
  .called  { background: rgba(22,163,74,.12); color: #7ee2a6; border-color: rgba(22,163,74,.28); }
  .uncalled{ background: rgba(100,116,139,.12); color: #cbd5e1; border-color: rgba(100,116,139,.28); }

  .party {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px;
    border: 1px solid var(--border);
  }
  .party.REP { background: rgba(239,68,68,.15); color: #fecaca; border-color: rgba(239,68,68,.35); }
  .party.DEM { background: rgba(59,130,246,.15); color: #bfdbfe; border-color: rgba(59,130,246,.35); }
  .party.IND { background: rgba(148,163,184,.15); color: #e2e8f0; border-color: rgba(148,163,184,.35); }
  .party.other { background: rgba(148,163,184,.10); color: #e2e8f0; border-color: rgba(148,163,184,.25); }

  .pill { font: 600 12px/1 ui-monospace, monospace; color: #cbd5e1; background:#1a2133;
          border: 1px solid var(--border); border-radius: 999px; padding: 6px 10px; }
  .footer { margin-top: 10px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>House 2026 — District Calls</h1>
    <div class="sub">Reads <code>../temp/p_cache.json</code> → <span class="mono">H:G / H:GEN</span></div>
  </header>

  <main class="wrap">
    <div class="card">
      <div class="controls">
        <button id="reloadBtn">Reload</button>
        <span id="totals" class="pill">—</span>
        <span id="leaders" class="pill">—</span>
      </div>
      <div id="meta" class="meta"></div>

      <div class="table-wrap">
        <table id="callsTable" aria-label="District calls for House 2026">
          <thead>
            <tr>
              <th style="width:80px;">State</th>
              <th style="width:90px;">District</th>
              <th>Status</th>
              <th>Winner</th>
              <th>Party</th>
              <th style="width:120px;">% In (Dist)</th>
              <th style="width:120px;">% In (State)</th>
            </tr>
          </thead>
          <tbody id="callsBody">
            <tr><td colspan="7" class="mono" style="color:#9fb3d1;">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="footer" id="counts"></div>
    </div>
  </main>

<script>
async function fetchData() {
  const res = await fetch(`/api/house2026?raceTypeId=G`, { cache: "no-store" });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || ("HTTP " + res.status));
  }
  return res.json();
}

function statusTag(status) {
  const s = (status || "").toLowerCase();
  const cls = s === "called" ? "called" : "uncalled";
  return `<span class="tag ${cls}">${status || "No Data"}</span>`;
}

function partyChip(party) {
  if (!party) return `<span class="party other">—</span>`;
  const p = String(party).toUpperCase();
  const known = ["DEM","REP","IND"];
  const cls = known.includes(p) ? p : "other";
  return `<span class="party ${cls}">${p}</span>`;
}

function isCalled(status) {
  if (!status) return false;
  const s = status.toLowerCase();
  if (/no decision|too early|too close|no call/.test(s)) return false;
  return /call/.test(s); // "Called", "Race Called", etc.
}

function render(data) {
  const meta = document.getElementById("meta");
  meta.textContent = `Source: ${data.source_path} • Race Key: ${data.race_key} • States: ${data.states_count} • Districts: ${data.districts_count}`;

  const tbody = document.getElementById("callsBody");
  tbody.innerHTML = "";

  let called = { DEM:0, REP:0, IND:0, OTHER:0 };
  let leaders = { DEM:0, REP:0, IND:0, OTHER:0 };

  // optional helper if you later want to treat a leading party for uncalled
  function partyOrOther(p){ p=(p||"").toUpperCase(); return (p==="DEM"||p==="REP"||p==="IND")?p:"OTHER"; }

  for (const row of data.rows) {
    const s = row.status || "No Data";
    const calledFlag = isCalled(s);
    const name = row.winner_name || (calledFlag ? "(winner name missing)" : "—");
    const party = row.winner_party || null;

    if (calledFlag) {
      called[partyOrOther(party)]++;
    } else {
      // (optional) if you feed leaders separately, compute here
      // leaders[partyOrOther(inferLeaderSomehow)]++;
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="mono">${row.state}</td>
      <td class="mono">${String(row.district_num ?? "").padStart(2,"0")}</td>
      <td>${statusTag(s)}</td>
      <td>${name ? name : "—"}</td>
      <td>${partyChip(party)}</td>
      <td class="mono" style="text-align:right">${row.percent_in ?? "—"}</td>
      <td class="mono" style="text-align:right">${row.state_percent_in ?? "—"}</td>
    `;
    tbody.appendChild(tr);
  }

  document.getElementById("counts").textContent =
    `Called totals — REP: ${called.REP} • DEM: ${called.DEM} • IND: ${called.IND} • Other: ${called.OTHER}`;

  document.getElementById("totals").textContent =
    `CALLED — R:${called.REP} D:${called.DEM} I:${called.IND} O:${called.OTHER}`;

  document.getElementById("leaders").textContent =
    `LEADING — (add logic if you want to show leaders separately)`;
}

async function load() {
  const body = document.getElementById("callsBody");
  body.innerHTML = `<tr><td colspan="7" class="mono" style="color:#9fb3d1;">Loading…</td></tr>`;
  try {
    const data = await fetchData();
    render(data);
  } catch (e) {
    body.innerHTML = `<tr><td colspan="7" class="mono" style="color:#9fb3d1;">Error: ${e.message}</td></tr>`;
    console.error(e);
  }
}

document.getElementById("reloadBtn").addEventListener("click", load);
load();
</script>
</body>
</html>
