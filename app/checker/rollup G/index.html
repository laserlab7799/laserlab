<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>2026 Governor Rollup</title>
  <style>
    :root{
      --dem:#1877F2;
      --rep:#D32F2F;
      --ind:#7B7B7B;
      --bg:#0b0b0c;
      --card:#121316;
      --muted:#b6bcc7;
      --text:#f5f7fa;
      --accent:#2b2f36;
    }
    html,body{height:100%;}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    header{
      padding:16px 20px; border-bottom:1px solid var(--accent);
      display:flex; align-items:center; justify-content:space-between;
    }
    header h1{margin:0; font-weight:700; font-size:20px; letter-spacing:.3px;}
    header .sub{color:var(--muted); font-size:12px;}
    .wrap{max-width:1100px; margin:24px auto; padding:0 16px;}
    .grid{display:grid; grid-template-columns: repeat(12,1fr); gap:16px;}
    .card{
      background:var(--card); border:1px solid var(--accent);
      border-radius:14px; padding:16px;
    }
    .k-row{display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;}
    .k{
      display:flex; align-items:baseline; gap:8px; padding:10px 12px;
      border-radius:12px; border:1px solid var(--accent); background:#0f1115;
      min-width:180px;
    }
    .k .dot{width:10px; height:10px; border-radius:50%;}
    .k .label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
    .k .val{font-weight:800; font-size:22px;}
    .dem .dot{background:var(--dem);}
    .rep .dot{background:var(--rep);}
    .ind .dot{background:var(--ind);}
    .zero{border-style:dashed;}
    .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    button{
      background:#1a1f27; color:var(--text); border:1px solid var(--accent);
      padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:600;
    }
    button:hover{filter:brightness(1.1);}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
    .small{font-size:12px; color:var(--muted);}
    .bar{height:8px; border-radius:999px; background:#0e1116; border:1px solid var(--accent); overflow:hidden;}
    .bar > div{height:100%;}
    .row{display:flex; gap:14px; align-items:center;}
    .party-title{font-weight:700; font-size:14px; color:var(--muted); margin-bottom:10px;}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Governor 2026 — National Rollup</h1>
      <div class="sub">Called vs. Uncalled (current leader) • One race per state</div>
    </div>
    <div class="controls">
      <button id="refreshBtn">Refresh Now</button>
      <span class="small">Auto-refresh: <span id="tick" class="mono">—</span>s</span>
      <span class="small">Last update: <span id="last" class="mono">—</span></span>
    </div>
  </header>

  <div class="wrap">
    <div class="grid">
      <div class="card" style="grid-column: span 12;">
        <div class="party-title">Totals</div>
        <div class="k-row" id="totals"></div>
      </div>

      <div class="card" style="grid-column: span 12;">
        <div class="party-title">Breakdown</div>

        <div class="row" style="margin:8px 0;">
          <div style="width:120px;">Called</div>
          <div class="bar" style="flex:1;">
            <div id="bar-called-dem" style="background:var(--dem); width:0%"></div>
            <div id="bar-called-ind" style="background:var(--ind); width:0%"></div>
            <div id="bar-called-rep" style="background:var(--rep); width:0%"></div>
          </div>
          <div class="small mono" id="calledPct">—</div>
        </div>

        <div class="row" style="margin:8px 0;">
          <div style="width:120px;">Uncalled Leaders</div>
          <div class="bar" style="flex:1;">
            <div id="bar-uncalled-dem" style="background:var(--dem); width:0%"></div>
            <div id="bar-uncalled-ind" style="background:var(--ind); width:0%"></div>
            <div id="bar-uncalled-rep" style="background:var(--rep); width:0%"></div>
          </div>
          <div class="small mono" id="uncalledPct">—</div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Injected by app.py
    const API_BASE = "{{ API_BASE }}"; // e.g., http://localhost:5037

    const DATE_STR  = "2026-11-03";
    const OFFICE    = "G";
    const RACE_TYPE = "G"; // general
    
    // Only the 50 states have Senate seats
    const VALID_SENATE_USPS = new Set([
      "AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA",
      "HI","ID","IL","IN","IA","KS","KY","LA","ME","MD",
      "MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ",
      "NM","NY","NC","ND","OH","OK","OR","PA","RI","SC",
      "SD","TN","TX","UT","VT","VA","WA","WV","WI","WY",
    ]);

    // ─────────────────────────────────────────────────────────────
    // NEW: NO-RACE set for Governor 2026 (respects window var)
    // ─────────────────────────────────────────────────────────────
    const NO_GOVERNOR_2026 = (typeof window !== 'undefined' && window.GOVERNOR_2026_NO_RACE)
      ? window.GOVERNOR_2026_NO_RACE
      : new Set([
          'ME','AL','TX','NV','OR',
          'KY','WI','AZ','GA','NC',
          'CO','AR','IL','OK','MI',
          'WA','TN','PA','LA','NM'
        ]);

    const els = {
      totals: document.getElementById("totals"),
      tick: document.getElementById("tick"),
      last: document.getElementById("last"),
      calledPct: document.getElementById("calledPct"),
      uncalledPct: document.getElementById("uncalledPct"),
      bars: {
        called:   {DEM:document.getElementById("bar-called-dem"),   IND:document.getElementById("bar-called-ind"),   REP:document.getElementById("bar-called-rep")},
        uncalled: {DEM:document.getElementById("bar-uncalled-dem"), IND:document.getElementById("bar-uncalled-ind"), REP:document.getElementById("bar-uncalled-rep")},
      }
    };

    function nowStamp(){
      const d = new Date();
      return d.toLocaleTimeString();
    }

    async function fetchJSON(url){
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
      return r.json();
    }
    async function fetchXML(url){
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
      const txt = await r.text();
      return new window.DOMParser().parseFromString(txt, "application/xml");
    }

    function normParty(p){
      if(!p) return "IND";
      const s = p.trim().toUpperCase();
      if(s.startsWith("D")) return "DEM";     // DEM, DFL, etc.
      if(s.startsWith("R")) return "REP";     // REP, GOP
      if(s.startsWith("I")) return "IND";
      return (s === "DEM" || s === "REP" || s === "IND") ? s : "IND";
    }

    function toInt(x){
      const n = parseInt(String(x||"").replace(/[^\d-]/g,""), 10);
      return isNaN(n) ? 0 : n;
    }

    // Pull exactly one decision per state:
    // 1) If RaceCallStatus="Called", use WinnerParty from the root element.
    // 2) Else, find the single STATEWIDE reporting unit (Level="state") and
    //    pick the current leader by top VoteCount within that RU.
    async function buildRollup(){
      const states = await fetchJSON(`${API_BASE}/registry/states`);
      const agg = {
        called:{DEM:0,REP:0,IND:0},
        uncalled:{DEM:0,REP:0,IND:0},
        zero:0, total:0
      };

      for (const usps of states){
        if (!VALID_SENATE_USPS.has(usps)) continue; // ← exclude territories/DC
        // ───────────────────────────────────────────
        // NEW: exclude no-race states for Governor
        // ───────────────────────────────────────────
        if (NO_GOVERNOR_2026.has(usps)) continue;

        const url = `${API_BASE}/v2/elections/${DATE_STR}?statepostal=${usps}&officeId=${OFFICE}&raceTypeId=${RACE_TYPE}`;
        let xml; try { xml = await fetchXML(url); } catch { continue; }

        const root = xml.documentElement;
        if(!root || root.tagName !== "ElectionResults") continue;

        const raceCallStatus = (root.getAttribute("RaceCallStatus") || "").toLowerCase();
        const winnerPartyRaw = root.getAttribute("WinnerParty");

        const rus = Array.from(xml.getElementsByTagName("ReportingUnit"));
        const statewideRU =
          rus.find(ru => (ru.getAttribute("Level")||ru.getAttribute("level")||"").toLowerCase()==="state") ||
          rus.find(ru => (ru.getAttribute("Type")||"").toLowerCase()==="state") ||
          rus.find(ru => (ru.getAttribute("FIPS")||"").length===2) || null;

        if (raceCallStatus !== "called" && !statewideRU) continue;

        agg.total += 1;

        if (raceCallStatus === "called"){
          const wParty = normParty(winnerPartyRaw);
          agg.called[wParty] = (agg.called[wParty] || 0) + 1;
          continue;
        }

        if (statewideRU){
          const cands = Array.from(statewideRU.getElementsByTagName("Candidate")).map(c => ({
            party: normParty(c.getAttribute("Party")),
            votes: toInt(c.getAttribute("VoteCount"))
          }));
          const totalVotes = cands.reduce((a,c)=>a+c.votes,0);
          if (totalVotes === 0){
            agg.zero += 1;
          } else {
            const leader = cands.slice().sort((a,b)=>b.votes-a.votes)[0];
            agg.uncalled[leader.party] = (agg.uncalled[leader.party]||0)+1;
          }
        } else {
          agg.zero += 1;
        }
      }
      return agg;
    }


    function pct(n,d){ return d>0 ? Math.round((100*n)/d) : 0; }

    function render(agg){
      const total = agg.total || 0;
      const calledTotal = agg.called.DEM + agg.called.REP + (agg.called.IND||0);
      const uncalledTotal = agg.uncalled.DEM + agg.uncalled.REP + (agg.uncalled.IND||0);

      document.getElementById("totals").innerHTML = `
        <div class="k dem"><div class="dot"></div><div>
          <div class="label">Democrats — Called</div><div class="val">${agg.called.DEM}</div>
        </div></div>
        <div class="k dem"><div class="dot"></div><div>
          <div class="label">Democrats — Uncalled Leaders</div><div class="val">${agg.uncalled.DEM}</div>
        </div></div>

        <div class="k ind"><div class="dot"></div><div>
          <div class="label">Independents — Called</div><div class="val">${agg.called.IND}</div>
        </div></div>
        <div class="k ind"><div class="dot"></div><div>
          <div class="label">Independents — Uncalled Leaders</div><div class="val">${agg.uncalled.IND}</div>
        </div></div>

        <div class="k rep"><div class="dot"></div><div>
          <div class="label">Republicans — Called</div><div class="val">${agg.called.REP}</div>
        </div></div>
        <div class="k rep"><div class="dot"></div><div>
          <div class="label">Republicans — Uncalled Leaders</div><div class="val">${agg.uncalled.REP}</div>
        </div></div>

        <div class="k zero"><div class="dot" style="background:#444"></div><div>
          <div class="label">Races with All-Zero Votes</div><div class="val">${agg.zero}</div>
        </div></div>
        <div class="k"><div class="dot" style="background:#444"></div><div>
          <div class="label">Total Races Seen</div><div class="val">${total}</div>
        </div></div>
      `;

      const setWidths = (bars, dem, ind, rep) => {
        const sum = dem+ind+rep;
        const wDem = sum ? (100*dem/sum) : 0;
        const wInd = sum ? (100*ind/sum) : 0;
        const wRep = sum ? (100*rep/sum) : 0;
        bars.DEM.style.width = `${wDem}%`;
        bars.IND.style.width = `${wInd}%`;
        bars.REP.style.width = `${wRep}%`;
      };

      setWidths(els.bars.called,   agg.called.DEM,   agg.called.IND,   agg.called.REP);
      setWidths(els.bars.uncalled, agg.uncalled.DEM, agg.uncalled.IND, agg.uncalled.REP);

      els.calledPct.textContent   = `${calledTotal}/${total} (${pct(calledTotal,total)}%)`;
      els.uncalledPct.textContent = `${uncalledTotal}/${total} (${pct(uncalledTotal,total)}%)`;
      els.last.textContent = nowStamp();
    }

    let remaining = 30;
    let timer = null;

    async function refresh(){
      try{
        const agg = await buildRollup();
        render(agg);
        remaining = 30;
      }catch(err){
        console.error(err);
      }
    }

    function loop(){
      clearInterval(timer);
      timer = setInterval(()=>{
        remaining -= 1;
        if(remaining <= 0){
          refresh();
        }
        els.tick.textContent = remaining;
      }, 1000);
    }

    document.getElementById("refreshBtn").addEventListener("click", refresh);

    (async () => {
      await refresh();
      loop();
    })();
  </script>
</body>
</html>
