<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Senate 2026 Calls — From p_cache.json</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #151822;
    --text: #eaeef6;
    --muted: #94a3b8;
    --border: #232839;
    --green: #16a34a;
    --red: #ef4444;
    --gray: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
    background: linear-gradient(180deg, #121624, #0f1115);
    position: sticky; top: 0; z-index: 10;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; }
  .wrap {
    max-width: 980px; margin: 24px auto; padding: 0 16px 32px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
  }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; word-break: break-all; }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    background: #1f2435; color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #242a3f; }
  table {
    width: 100%; border-collapse: collapse; font-size: 14px;
  }
  thead th {
    text-align: left; color: var(--muted); font-weight: 600;
    padding: 10px 10px; border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 10px 10px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; line-height: 18px; border: 1px solid var(--border);
    background: #1a1f2f; color: var(--muted);
  }
  .tag.called { background: rgba(22,163,74,.12); color: #7ee2a6; border-color: rgba(22,163,74,.28); }
  .tag.uncalled { background: rgba(100,116,139,.12); color: #cbd5e1; border-color: rgba(100,116,139,.28); }
  .party {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px;
    border: 1px solid var(--border);
  }
  .party.REP { background: rgba(239,68,68,.15); color: #fecaca; border-color: rgba(239,68,68,.35); }
  .party.DEM { background: rgba(59,130,246,.15); color: #bfdbfe; border-color: rgba(59,130,246,.35); }
  .party.IND { background: rgba(148,163,184,.15); color: #e2e8f0; border-color: rgba(148,163,184,.35); }
  .party.other { background: rgba(148,163,184,.10); color: #e2e8f0; border-color: rgba(148,163,184,.25); }
  .fade { color: var(--muted); }
  .footer { margin-top: 10px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Senate 2026 — State Calls</h1>
    <div class="sub">Reads <code>../../temp/p_cache.json</code> → <span class="mono">S:G</span></div>
  </header>

  <main class="wrap">
    <div class="card">
      <div class="controls">
        <button id="reloadBtn">Reload</button>
      </div>
      <div id="meta" class="meta"></div>
      <div class="table-wrap">
        <table id="callsTable" aria-label="State calls for Senate 2026 General">
          <thead>
            <tr>
              <th style="width: 90px;">State</th>
              <th>Status</th>
              <th>Winner</th>
              <th>Party</th>
            </tr>
          </thead>
          <tbody id="callsBody">
            <tr><td colspan="4" class="fade">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="footer" id="counts"></div>
    </div>
  </main>

<script>
async function fetchData() {
  const res = await fetch("/api/senate2026", { cache: "no-store" });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || ("HTTP " + res.status));
  }
  return res.json();
}

function statusTag(status) {
  const s = (status || "").toLowerCase();
  const cls = s === "called" ? "called" : "uncalled";
  return `<span class="tag ${cls}">${status || "No Data"}</span>`;
}

function partyChip(party) {
  if (!party) return `<span class="party other">—</span>`;
  const p = String(party).toUpperCase();
  const known = ["DEM","REP","IND"];
  const cls = known.includes(p) ? p : "other";
  return `<span class="party ${cls}">${p}</span>`;
}

function render(data) {
  const meta = document.getElementById("meta");
  meta.textContent = `Source: ${data.source_path} • Race Key: ${data.race_key}`;

  const tbody = document.getElementById("callsBody");
  tbody.innerHTML = "";

  let dem = 0, rep = 0, ind = 0, other = 0;

  for (const row of data.states) {
    const s = row.status || "No Data";
    const called = s.toLowerCase() === "called";
    const name = row.winner_name || (called ? "(winner name missing)" : "—");
    const party = row.winner_party || null;

    if (called) {
      const p = (party || "").toUpperCase();
      if (p === "DEM") dem++;
      else if (p === "REP") rep++;
      else if (p === "IND") ind++;
      else other++;
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="mono">${row.state}</td>
      <td>${statusTag(s)}</td>
      <td>${name ? name : "—"}</td>
      <td>${partyChip(party)}</td>
    `;
    tbody.appendChild(tr);
  }

  const counts = document.getElementById("counts");
  counts.textContent = `Called totals — REP: ${rep} • DEM: ${dem} • IND: ${ind} • Other: ${other}`;
}

async function load() {
  const body = document.getElementById("callsBody");
  body.innerHTML = `<tr><td colspan="4" class="fade">Loading…</td></tr>`;
  try {
    const data = await fetchData();
    render(data);
  } catch (e) {
    body.innerHTML = `<tr><td colspan="4" class="fade">Error: ${e.message}</td></tr>`;
    console.error(e);
  }
}

document.getElementById("reloadBtn").addEventListener("click", load);
load();
</script>
</body>
</html>
