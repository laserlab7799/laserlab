<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Senate Holdovers Admin</title>
  <style>
    body{ font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin:0; padding:14px; background:#0b0f14; color:#e8eef6; }
    h2{ margin:0 0 10px 0; font-weight:650; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
    .card{ background:#111826; border:1px solid #22314a; border-radius:10px; padding:12px; }
    label{ font-size:12px; opacity:.9; }
    input, select{ background:#0b1220; color:#e8eef6; border:1px solid #22314a; border-radius:8px; padding:8px 10px; }
    input{ width:90px; }
    button{ background:#1b2a44; color:#e8eef6; border:1px solid #2f4670; border-radius:10px; padding:8px 12px; cursor:pointer; }
    button:hover{ filter:brightness(1.08); }
    textarea{
      width:100%; height:320px; background:#0b1220; color:#e8eef6;
      border:1px solid #22314a; border-radius:10px; padding:10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:12px;
    }
    .msg{ white-space:pre-wrap; font-size:12px; opacity:.95; }
    .muted{ opacity:.75; font-size:12px; }
    .pill{ display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid #2f4670; background:#0b1220; font-size:12px; }
  </style>
</head>
<body>

  <h2>Senate Holdovers Admin</h2>
  <div class="muted">
    Saves to <span class="pill">../HistoricData/senate_holdovers.json</span>
  </div>

  <div class="row card">
    <button id="loadBtn">Load</button>
    <button id="saveBtn">Save</button>
    <button id="prettyBtn">Pretty-print</button>
    <span id="status" class="msg"></span>
  </div>

  <div class="row card">
    <label>Year</label>
    <input id="year" value="2026"/>

    <label>DEM</label>
    <input id="dem" value="28"/>

    <label>REP</label>
    <input id="rep" value="38"/>

    <label>IND</label>
    <input id="ind" value="0"/>

    <button id="applyBtn">Apply Year Row</button>
    <button id="removeBtn">Remove Year</button>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px;">
      JSON format is: <span class="pill">{ "by_year": { "2026": {"DEM":..,"REP":..,"IND":..}, ... } }</span>
    </div>
    <textarea id="json"></textarea>
  </div>

<script>
const $ = (id)=>document.getElementById(id);

// These endpoints are what the page calls.
// You’ll add matching Flask routes (next section).
const API_LOAD = "/api/holdovers/senate/load";
const API_SAVE = "/api/holdovers/senate/save";

function pretty(obj){ return JSON.stringify(obj, null, 2); }

function parseJson(){
  try { return JSON.parse($("json").value || "{}"); }
  catch(e){
    $("status").textContent = "JSON parse error: " + e.message;
    return null;
  }
}

function sanitizeHoldoverObj(o){
  const n = (v)=>{ const x = parseInt(v,10); return Number.isFinite(x) ? x : 0; };
  return { DEM: n(o?.DEM), REP: n(o?.REP), IND: n(o?.IND) };
}

function ensureSchema(obj){
  if (!obj || typeof obj !== "object") obj = {};
  if (!obj.by_year || typeof obj.by_year !== "object") obj.by_year = {};
  return obj;
}

async function load(){
  $("status").textContent = "Loading...";
  try{
    const res = await fetch(API_LOAD, { cache:"no-store" });
    const j = await res.json();
    $("json").value = pretty(ensureSchema(j));
    $("status").textContent = res.ok ? "Loaded." : ("Load failed: " + res.status);
  }catch(e){
    $("status").textContent = "Load error: " + e.message;
  }
}

async function save(){
  const obj = parseJson(); if (!obj) return;
  const clean = ensureSchema(obj);

  // sanitize each year entry
  Object.keys(clean.by_year).forEach(y=>{
    clean.by_year[String(y)] = sanitizeHoldoverObj(clean.by_year[y]);
  });

  $("status").textContent = "Saving...";
  try{
    const res = await fetch(API_SAVE, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(clean)
    });
    const j = await res.json();
    $("status").textContent = res.ok ? ("Saved.\n" + pretty(j)) : ("Save failed.\n" + pretty(j));
  }catch(e){
    $("status").textContent = "Save error: " + e.message;
  }
}

function applyRow(){
  const obj = ensureSchema(parseJson()); if (!obj) return;
  const y = String($("year").value || "").trim();
  if (!y) { $("status").textContent = "Missing year"; return; }

  obj.by_year[y] = sanitizeHoldoverObj({
    DEM: $("dem").value, REP: $("rep").value, IND: $("ind").value
  });

  $("json").value = pretty(obj);
  $("status").textContent = "Applied year " + y;
}

function removeYear(){
  const obj = ensureSchema(parseJson()); if (!obj) return;
  const y = String($("year").value || "").trim();
  if (obj.by_year && obj.by_year[y]) delete obj.by_year[y];
  $("json").value = pretty(obj);
  $("status").textContent = "Removed year " + y;
}

$("loadBtn").onclick = load;
$("saveBtn").onclick = save;
$("prettyBtn").onclick = ()=>{ const o=parseJson(); if(o) $("json").value = pretty(ensureSchema(o)); };
$("applyBtn").onclick = applyRow;
$("removeBtn").onclick = removeYear;

load();
</script>
</body>
</html>
