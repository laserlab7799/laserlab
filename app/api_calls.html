<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Calls</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px;
      background: #f2f4f7;
      color: #171a21;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(1500px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      color: #667085;
      font-size: 14px;
      white-space: nowrap;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 9px 13px;
      background: #26364e;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .status-line {
      margin-bottom: 12px;
      color: #667085;
      font-size: 14px;
    }

    .error {
      margin-bottom: 12px;
      padding: 11px 13px;
      border: 1px solid #f2b8b5;
      border-radius: 7px;
      background: #fff0ef;
      color: #b42318;
      white-space: pre-wrap;
    }

    .list {
      overflow: hidden;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      background: white;
    }

    .row {
      display: grid;
      grid-template-columns: 175px 190px minmax(300px, 1fr) 130px;
      gap: 12px;
      align-items: start;
      padding: 12px 14px;
      border-bottom: 1px solid #e4e7ec;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row.header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding-top: 10px;
      padding-bottom: 10px;
      background: #26364e;
      color: white;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .time {
      color: #475467;
      font-size: 13px;
      white-space: nowrap;
    }

    .type {
      font-weight: 800;
    }

    .url {
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .status {
      display: inline-block;
      justify-self: start;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .ok {
      background: #e7f6ec;
      color: #157347;
    }

    .bad {
      background: #fff0ef;
      color: #b42318;
    }

    .unknown {
      background: #f2f4f7;
      color: #475467;
    }

    .empty {
      padding: 35px 18px;
      text-align: center;
      color: #667085;
    }

    @media (max-width: 850px) {
      body { padding: 10px; }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .row.header {
        display: none;
      }

      .time::before {
        content: "TIME: ";
        font-weight: 800;
      }

      .type::before {
        content: "TYPE: ";
        color: #667085;
        font-size: 11px;
      }

      .url::before {
        content: "URL: ";
        color: #667085;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        font-weight: 800;
      }
    }
  </style>
</head>
<body>
<main class="page">
  <header>
    <h1>API Calls</h1>

    <div class="controls">
      <label>
        <input id="autoRefresh" type="checkbox" checked>
        Refresh every 5 seconds
      </label>
      <button id="refreshButton" type="button">Refresh</button>
    </div>
  </header>

  <div id="statusLine" class="status-line">Loading calls…</div>
  <div id="errorBox" class="error" hidden></div>

  <section id="callList" class="list">
    <div class="empty">Loading…</div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const TREND_URLS = {
    H: "https://api.ap.org/v3/reports/Trend-h-20241105-US-Live",
    S: "https://api.ap.org/v3/reports/Trend-s-20241105-US-Live"
  };

  const callList = document.getElementById("callList");
  const statusLine = document.getElementById("statusLine");
  const errorBox = document.getElementById("errorBox");
  const refreshButton = document.getElementById("refreshButton");
  const autoRefresh = document.getElementById("autoRefresh");

  let loading = false;
  let timer = null;

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function timestampValue(value) {
    if (!value) return 0;

    const raw = String(value).trim();
    const iso = raw.includes("T") || /Z$|[+-]\d\d:\d\d$/.test(raw)
      ? raw
      : raw.replace(" ", "T") + "Z";

    const ms = Date.parse(iso);
    return Number.isFinite(ms) ? ms : 0;
  }

  function formatTime(value) {
    const ms = timestampValue(value);
    if (!ms) return String(value || "—");
    return new Date(ms).toLocaleString();
  }

  async function getJson(url) {
    const response = await fetch(url, {
      cache: "no-store",
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
      throw new Error(`${url} returned HTTP ${response.status}`);
    }

    return response.json();
  }

  function normalType(hit) {
    const which = String(hit?.which || "").toLowerCase();
    const url = String(hit?.url || "");
    const isApp = /[?&]raceTypeID=APP(?:&|$)/i.test(url);

    if (which === "full") return "FULL";
    if (which === "quick") return isApp ? "QUICK PRIMARY APP" : "QUICK PRIMARY";
    if (which === "main") return isApp ? "PRIMARY MAIN APP" : "PRIMARY MAIN";
    if (which === "secondary") return isApp ? "PRIMARY SECONDARY APP" : "PRIMARY SECONDARY";

    return which ? which.toUpperCase() : "API";
  }

  function normalStatus(status) {
    const number = Number(status);

    if (number >= 200 && number < 300) {
      return {
        text: `${number} OK`,
        className: "ok"
      };
    }

    if (number > 0) {
      return {
        text: `${number} ERROR`,
        className: "bad"
      };
    }

    return {
      text: String(status || "UNKNOWN").toUpperCase(),
      className: "unknown"
    };
  }

  function normalEntries(hits) {
    return (Array.isArray(hits) ? hits : []).map((hit, index) => {
      const status = normalStatus(hit.status);

      return {
        time: hit.ts,
        timeValue: timestampValue(hit.ts),
        order: 100000 - index,
        type: normalType(hit),
        url: hit.url || "—",
        statusText: status.text,
        statusClass: status.className
      };
    });
  }

  function trendEntry(item) {
    const message = String(item?.msg || "");
    let office = null;
    let statusText = null;
    let statusClass = null;

    let match = message.match(/^Fetched Trend ([HS]):/i);
    if (match) {
      office = match[1].toUpperCase();
      statusText = "200 OK";
      statusClass = "ok";
    }

    if (!office) {
      match = message.match(/^Trend ([HS]) unchanged\.?$/i);
      if (match) {
        office = match[1].toUpperCase();
        statusText = "200 OK";
        statusClass = "ok";
      }
    }

    if (!office) {
      match = message.match(/^HTTP (\d+) from Trend ([HS])/i);
      if (match) {
        office = match[2].toUpperCase();
        const code = Number(match[1]);
        statusText = code >= 200 && code < 300 ? `${code} OK` : `${code} ERROR`;
        statusClass = code >= 200 && code < 300 ? "ok" : "bad";
      }
    }

    if (!office) {
      match = message.match(/^Transport error \(Trend ([HS])\):/i);
      if (match) {
        office = match[1].toUpperCase();
        statusText = "TRANSPORT ERROR";
        statusClass = "bad";
      }
    }

    if (!office) {
      match = message.match(/^Incomplete, test, or invalid Trend ([HS]) response/i);
      if (match) {
        office = match[1].toUpperCase();
        statusText = "INVALID RESPONSE";
        statusClass = "bad";
      }
    }

    if (!office) {
      match = message.match(/^Older Trend ([HS]) response ignored/i);
      if (match) {
        office = match[1].toUpperCase();
        statusText = "STALE RESPONSE";
        statusClass = "bad";
      }
    }

    if (!office) {
      match = message.match(/^Unhandled Trend ([HS]) refresh error/i);
      if (match) {
        office = match[1].toUpperCase();
        statusText = "ERROR";
        statusClass = "bad";
      }
    }

    if (!office) return null;

    return {
      time: item.ts,
      timeValue: timestampValue(item.ts),
      order: Number(item.seq || 0),
      type: office === "H" ? "TREND HOUSE" : "TREND SENATE",
      url: TREND_URLS[office],
      statusText,
      statusClass
    };
  }

  function trendEntries(logPayload, oldestNormalTime) {
    const items = Array.isArray(logPayload?.items) ? logPayload.items : [];

    return items
      .map(trendEntry)
      .filter(Boolean)
      .filter(entry => !oldestNormalTime || entry.timeValue >= oldestNormalTime);
  }

  function render(entries) {
    if (!entries.length) {
      callList.innerHTML = `<div class="empty">No API calls are currently recorded.</div>`;
      return;
    }

    callList.innerHTML = `
      <div class="row header">
        <div>Time</div>
        <div>Type</div>
        <div>URL</div>
        <div>Status</div>
      </div>

      ${entries.map(entry => `
        <div class="row">
          <div class="time">${escapeHtml(formatTime(entry.time))}</div>
          <div class="type">${escapeHtml(entry.type)}</div>
          <div class="url">${escapeHtml(entry.url)}</div>
          <div>
            <span class="status ${escapeHtml(entry.statusClass)}">
              ${escapeHtml(entry.statusText)}
            </span>
          </div>
        </div>
      `).join("")}
    `;
  }

  async function refresh() {
    if (loading) return;

    loading = true;
    refreshButton.disabled = true;
    errorBox.hidden = true;
    errorBox.textContent = "";

    try {
      const results = await Promise.allSettled([
        getJson("/admin/last-hit"),
        getJson("/log?since=0")
      ]);

      const hits =
        results[0].status === "fulfilled" && Array.isArray(results[0].value)
          ? results[0].value
          : [];

      const logs =
        results[1].status === "fulfilled"
          ? results[1].value
          : { items: [] };

      const normal = normalEntries(hits);
      const oldestNormalTime = normal.length
        ? Math.min(...normal.map(entry => entry.timeValue).filter(Boolean))
        : 0;

      const trend = trendEntries(logs, oldestNormalTime);

      const combined = [...normal, ...trend]
        .sort((a, b) =>
          b.timeValue - a.timeValue ||
          b.order - a.order
        )
        .slice(0, 100);

      render(combined);

      statusLine.textContent =
        `${combined.length} calls shown, newest first. Last checked ${new Date().toLocaleString()}.`;

      const errors = results
        .filter(result => result.status === "rejected")
        .map(result => result.reason?.message || String(result.reason));

      if (errors.length) {
        errorBox.hidden = false;
        errorBox.textContent = errors.join("\n");
      }
    } catch (error) {
      callList.innerHTML = `<div class="empty">Could not load API calls.</div>`;
      statusLine.textContent = "Load failed.";
      errorBox.hidden = false;
      errorBox.textContent = error.message;
    } finally {
      loading = false;
      refreshButton.disabled = false;
    }
  }

  function resetTimer() {
    if (timer) clearInterval(timer);
    timer = null;

    if (autoRefresh.checked) {
      timer = setInterval(refresh, 5000);
    }
  }

  refreshButton.addEventListener("click", refresh);
  autoRefresh.addEventListener("change", resetTimer);

  resetTimer();
  refresh();
})();
</script>
</body>
</html>
