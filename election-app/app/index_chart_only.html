<script>
    try {
    if (window.self !== window.top) document.body.classList.add("embedded");
    } catch(e) {}
    // --- quiet tagged console noise (keeps errors) ----------------------------
    // --- quiet tagged console noise (blocks tagged log/warn/error/info/debug) ---
    (function(){
      const BLOCK_PREFIXES = ["[chart]"]; // chart-only page

      const orig = {
        log: console.log.bind(console),
        warn: console.warn.bind(console),
        error: console.error.bind(console),
        info: console.info.bind(console),
        debug: console.debug.bind(console),

      function shouldBlock(args){

      for (const k of Object.keys(orig)){

(() => {
  // ---- Config ----
  // --- quiet tagged console noise (keeps errors) ----------------------------
  (function(){
    const BLOCK_PREFIXES = ["[chart]"];

    const origLog  = console.log.bind(console);
    const origWarn = console.warn.bind(console);

    function shouldBlock(args){
      const s = (typeof args?.[0] === "string") ? args[0] : "";
      return s && BLOCK_PREFIXES.some(p => s.startsWith(p));
    }

    console.log = (...args) => { if (shouldBlock(args)) return; return origLog(...args); };
    console.warn = (...args) => { if (shouldBlock(args)) return; return origWarn(...args); };
  })();

  console.log("[chart] script loaded");

  function clearPlot(){
    // Stop any playback immediately
    stopAnim();

    // Reset data + UI immediately
    rows = [];
    i = 0;
    renderRow(); // shows dashes right away

    // Clear SVG plot contents but keep the cursor line
    g.innerHTML = '';
    g.appendChild(cursorLine);
    drawCursorAt(0);
  }

  
  function setDataSource(path) {
    console.log("[chart] setDataSource called with:", path);

    if (!path) {
      console.warn("[chart] setDataSource called with empty path");
      return;
    }

    if (path === CURRENT_DATA_URL) {
      console.log("[chart] same path as before, ignoring");
      return;
    }

    CURRENT_DATA_URL = path;
    srcPathEl.textContent = path;

    console.log("[chart] CURRENT_DATA_URL set");

    currentIdx = 0;
    lastPayloadHash = null;

    clearPlot(); // clears + resets instantly
    console.log("[chart] plot cleared, fetching data");

    fetchData(); // fetch immediately (no waiting for the 5s poll)

  }


  const POLL_MS = 5000;
  let CURRENT_DATA_URL = null;

  // ---- Readout elements ----
  const bigXEl = document.getElementById('bigX');
  const bigMarginEl = document.getElementById('bigMargin');

  const xInEl = document.getElementById('xIn');
  const yLeaderEl = document.getElementById('yLeader');
  const yLeaderRawEl = document.getElementById('yLeaderRaw');
  const yTrailerEl = document.getElementById('yTrailer');
  const yTrailerRawEl = document.getElementById('yTrailerRaw');
  const yMarginEl = document.getElementById('yMargin');
  const idxEl = document.getElementById('idx');
  const totalEl = document.getElementById('total');
  const srcPathEl = document.getElementById('srcPath');


  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const animateBtn = document.getElementById('animateBtn');
  const loopBtn = document.getElementById('loopBtn');

  let isLoop = false;
  loopBtn.addEventListener('click', () => {
    isLoop = !isLoop;
    loopBtn.textContent = isLoop ? 'Loop: On' : 'Loop: Off';
    loopBtn.setAttribute('aria-pressed', String(isLoop));
  });

  
  function renderCurrentPoint() {
    if (!data || !data.length) return;
    currentIdx = Math.min(currentIdx, data.length - 1);
    drawAtIndex(currentIdx);
  }
  
  function fmt(v,d=2){ const n=Number(v); return Number.isFinite(n) ? n.toFixed(d) : '—'; }

  // ---- Plot core (copied from your index_gauge.html plot section) ----
// ---------- Right plot (pure SVG, JSON-driven) ----------
  const plot = document.getElementById('plot');
  const W = 1200;
  const H = 675;

  const m = { l: 70, r: 70, t: 30, b: 55 };
  const innerW = W - m.l - m.r;
  const innerH = H - m.t - m.b;
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('transform', `translate(${m.l},${m.t})`);
  plot.appendChild(g);
  // vertical cursor line (follows current statewide % in)
  const cursorLine = document.createElementNS(plot.namespaceURI,'line');
  cursorLine.setAttribute('class','cursorX');
  g.appendChild(cursorLine);

  // draw a vertical line at x=0, full height; we’ll slide it with a transform
  cursorLine.setAttribute('x1', 0);
  cursorLine.setAttribute('x2', 0);
  cursorLine.setAttribute('y1', 0);
  cursorLine.setAttribute('y2', innerH);

  function drawCursorAt(pct){
    const X = tx(Number(pct) || 0);
    cursorLine.setAttribute('transform', `translate(${X},0)`);
  }


  function add(el){ g.appendChild(el); return el; }
  function tx(x){ return (x/100)*innerW; }
  function tyLeft(y){ return innerH - (y/100)*innerH; }            // 0..100
  let RIGHT_MIN = -10, RIGHT_MAX = 55;  // default fallback

  function tyRight(pp){
    const min = RIGHT_MIN, max = RIGHT_MAX;
    return innerH - ((pp - min) / (max - min)) * innerH;
  }

  function setRightScaleByData(payload){
    const ys = (payload?.series?.statewide_margin_pp?.y || [])
      .map(Number)
      .filter((n) => Number.isFinite(n));

    if (!ys.length){
      RIGHT_MIN = -10; RIGHT_MAX = 55; // fallback if no margin series
      return;
    }

    let lo = Math.min(...ys);
    let hi = Math.max(...ys);

    if (lo === hi){ lo -= 1; hi += 1; }            // avoid zero-span
    const span0 = hi - lo;
    const pad = Math.max(2, span0 * 0.10);         // 10% padding, min 2pp
    lo -= pad; hi += pad;

    // Snap to “nice” 5-pt ticks
    RIGHT_MIN = Math.floor(lo / 5) * 5;
    RIGHT_MAX = Math.ceil(hi / 5) * 5;

    // Guarantee a minimum visible span (20pp)
    if (RIGHT_MAX - RIGHT_MIN < 20){
      const mid = (RIGHT_MIN + RIGHT_MAX) / 2;
      RIGHT_MIN = Math.floor((mid - 10) / 5) * 5;
      RIGHT_MAX = Math.ceil((mid + 10) / 5) * 5;
    }
  }


  function axis(){
    // outer frame
    const xAxis = document.createElementNS(plot.namespaceURI,'line');
    xAxis.setAttribute('x1',0); xAxis.setAttribute('y1',innerH);
    xAxis.setAttribute('x2',innerW); xAxis.setAttribute('y2',innerH);
    xAxis.setAttribute('stroke','#111'); xAxis.setAttribute('stroke-width','2');
    add(xAxis);

    const yAxis = document.createElementNS(plot.namespaceURI,'line');
    yAxis.setAttribute('x1',0); yAxis.setAttribute('y1',0);
    yAxis.setAttribute('x2',0); yAxis.setAttribute('y2',innerH);
    yAxis.setAttribute('stroke','#111'); yAxis.setAttribute('stroke-width','2');
    add(yAxis);
    // RIGHT y-axis


    // gridlines Y (left 0..100)
    for (let y=0; y<=100; y+=10){
      const ln = document.createElementNS(plot.namespaceURI,'line');
      ln.setAttribute('x1',0); ln.setAttribute('y1',tyLeft(y));
      ln.setAttribute('x2',innerW); ln.setAttribute('y2',tyLeft(y));
      ln.setAttribute('class','gridline'); add(ln);
    }
    // left y-axis ticks and labels (0..100 by 10)
    for (let y=0; y<=100; y+=10){
      const Y = tyLeft(y);

      // tick mark
      const tk = document.createElementNS(plot.namespaceURI,'line');
      tk.setAttribute('x1', -10); tk.setAttribute('y1', Y);
      tk.setAttribute('x2',  0); tk.setAttribute('y2', Y);
      tk.setAttribute('class','ytick'); tk.setAttribute('stroke-width','2');
      g.appendChild(tk);

      // numeric label
      const tl = document.createElementNS(plot.namespaceURI,'text');
      tl.setAttribute('x', -10); tl.setAttribute('y', Y+4);
      tl.setAttribute('text-anchor','end');
      tl.setAttribute('class','ytickLbl');
      tl.textContent = String(y);
      g.appendChild(tl);
    }

    // dashed reference at 50 and 15
    const ref50 = document.createElementNS(plot.namespaceURI,'line');
    ref50.setAttribute('x1',0); ref50.setAttribute('y1',tyLeft(50));
    ref50.setAttribute('x2',innerW); ref50.setAttribute('y2',tyLeft(50));
    ref50.setAttribute('stroke','#2563eb'); ref50.setAttribute('stroke-width','2.5'); ref50.setAttribute('stroke-dasharray','10 8'); add(ref50);


    // labels
    function label(txt,x,y,anchor='middle'){
      const t = document.createElementNS(plot.namespaceURI,'text');
      t.setAttribute('x',x);
      t.setAttribute('y',y);
      t.setAttribute('text-anchor',anchor);
      t.setAttribute('class','axisText');
      t.textContent = txt;
      g.appendChild(t);
    }

    label('VOTE % IN', innerW/2, innerH+48);
    // left title
    const leftT = document.createElementNS(plot.namespaceURI,'text');
    leftT.setAttribute('transform',`translate(-54, ${innerH/2}) rotate(-90)`);
    leftT.setAttribute('text-anchor','middle');
    leftT.setAttribute('class','axisText');
    leftT.textContent = 'WIN PROBABILITY (%)';
    g.appendChild(leftT);
    // right title


    // x ticks (every 10)
    for (let x=0;x<=100;x+=10){
      const t = document.createElementNS(plot.namespaceURI,'text');
      t.setAttribute('x',tx(x)); t.setAttribute('y',innerH+24); t.setAttribute('text-anchor','middle');
      t.setAttribute('class','axisText'); t.textContent = String(x);
      g.appendChild(t);
    }
    // right ticks (dynamic)


  }
  
  function plotLineLeft(xs, ys, cls){
    if (!xs?.length || !ys?.length) return;
    const d=[];
    for (let k=0;k<xs.length;k++){
      const x=Number(xs[k]), y=Number(ys[k]);
      if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
      const X = tx(x), Y = tyLeft(y);
      d.push(`${d.length?'L':'M'} ${X.toFixed(2)} ${Y.toFixed(2)}`);
    }
    const p = document.createElementNS(plot.namespaceURI,'path');
    p.setAttribute('d', d.join(' '));
    p.setAttribute('class', cls);
    g.appendChild(p);
  }


  function plotLine(xs, ys){
    if (!xs?.length || !ys?.length) return;
    const d = [];
    for (let k=0;k<xs.length;k++){
      const x = Number(xs[k]), y = Number(ys[k]);
      if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
      const X = tx(x), Y = tyRight(y);
      d.push(`${d.length?'L':'M'} ${X.toFixed(2)} ${Y.toFixed(2)}`);
    }
    const p = document.createElementNS(plot.namespaceURI,'path');
    p.setAttribute('d', d.join(' ')); p.setAttribute('class','lineMargin'); g.appendChild(p);
  }

  function plotScatter(xs, ys, cls, marker='circle'){
    if (!xs?.length || !ys?.length) return;
    for (let k=0;k<xs.length;k++){
      const x=Number(xs[k]), y=Number(ys[k]);
      if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
      const X = tx(x), Y = tyLeft(y);
      let node;
      if (marker==='square'){
        node = document.createElementNS(plot.namespaceURI,'rect');
        const s=14; node.setAttribute('x', X-s/2); node.setAttribute('y', Y-s/2); node.setAttribute('width', s); node.setAttribute('height', s);
      } else if (marker==='tri'){
        const s=14;
        const p1=`${X},${Y-9}`, p2=`${X-9},${Y+9}`, p3=`${X+9},${Y+9}`;
        node = document.createElementNS(plot.namespaceURI,'polygon');
        node.setAttribute('points', `${p1} ${p2} ${p3}`);
      } else {
        node = document.createElementNS(plot.namespaceURI,'circle');
        node.setAttribute('cx', X); node.setAttribute('cy', Y); node.setAttribute('r', 8);
      }
      node.setAttribute('class', `pt ${cls}`);
      g.appendChild(node);
    }
  }


  
  // ---- Series helpers (copied from index_gauge.html) ----
function partyFromColor(color){
    if (!color) return null; const c=String(color).toLowerCase();
    if (c.includes('red')) return 'Republican';
    if (c.includes('blue')) return 'Democratic';
    return null;
  }

function putSeries(map, series, prefix){
    const xs = Array.isArray(series.x)?series.x:[], ys=Array.isArray(series.y)?series.y:[],
          colors=Array.isArray(series.color)?series.color:[], markers=Array.isArray(series.marker)?series.marker:[];
    for (let k=0;k<xs.length;k++){
      const x=Number(xs[k]); if (!Number.isFinite(x)) continue;
      const xr = Number(x.toFixed(3));
      const row = map.get(xr) || {x:xr, leader_y:null,trailer_y:null,leader_raw_y:null,trailer_raw_y:null,margin_y:null,
                                  leader_color:null,leader_marker:null,trailer_color:null,trailer_marker:null};
      const y = Number(ys[k]);
      if (Number.isFinite(y)){
        if (prefix==='leader') row.leader_y=y;
        else if (prefix==='trailer') row.trailer_y=y;
        else if (prefix==='leader_raw') row.leader_raw_y=y;
        else if (prefix==='trailer_raw') row.trailer_raw_y=y;
        else if (prefix==='margin') row.margin_y=y;
      }
      const color = colors[k], marker = markers[k];
      if (prefix.startsWith('leader')){
        if (color) row.leader_color=color; if (marker) row.leader_marker=marker;
      } else if (prefix.startsWith('trailer')){
        if (color) row.trailer_color=color; if (marker) row.trailer_marker=marker;
      }
      map.set(xr,row);
    }
  }

function buildRows(payload){
    const S = payload?.series || {};
    const map = new Map();
    putSeries(map, S.leader || {}, 'leader');
    putSeries(map, S.trailer || {}, 'trailer');
    putSeries(map, S.leader_raw || {}, 'leader_raw');
    putSeries(map, S.trailer_raw || {}, 'trailer_raw');
    putSeries(map, S.statewide_margin_pp || {}, 'margin');

    // ---- RAW leader/trailer inference (use same source as the TABLE: points_by_x.raw.H / .raw.T) ----
    // This ensures the chart-only page can show/plot leader/trailer RAW even if series.leader_raw/trailer_raw
    // are missing or inconsistent.
    const pbx = payload?.points_by_x || {};
    if (pbx && typeof pbx === 'object'){
      const rawByX = new Map();
      for (const [k, v] of Object.entries(pbx)){
        const x = Number(k);
        if (!Number.isFinite(x)) continue;
        const xr = Number(x.toFixed(3));
        const raw = v?.raw || {};
        const h = Number(raw?.H);
        const t = Number(raw?.T);
        rawByX.set(xr, {
          h: Number.isFinite(h) ? h : null,
          t: Number.isFinite(t) ? t : null,
        });
      }

      for (const row of map.values()){
        const rt = rawByX.get(row.x);
        if (!rt) continue;

        const h = rt.h, t = rt.t;
        // If both are present, infer leader/trailer raw by which is higher.
        if (Number.isFinite(h) && Number.isFinite(t)){
          if (h >= t){
            row.leader_raw_y = h;
            row.trailer_raw_y = t;
          } else {
            row.leader_raw_y = t;
            row.trailer_raw_y = h;
          }
        } else if (Number.isFinite(h) && !Number.isFinite(t)){
          // Only Dem raw available
          row.leader_raw_y = h;
          row.trailer_raw_y = null;
        } else if (!Number.isFinite(h) && Number.isFinite(t)){
          // Only GOP raw available
          row.leader_raw_y = t;
          row.trailer_raw_y = null;
        }
      }
    }

    return Array.from(map.values()).sort((a,b)=>a.x-b.x);
  }

  // ---- Draw plot (copied from index_gauge.html) ----
function drawPlotFromJSON(payload){
    g.innerHTML = '';
    setRightScaleByData(payload);
    axis();
    // Recompute rows for THIS payload so the party lines don't skip any x
    const rowsLocal = buildRows(payload);
     // keep globals in sync with what we're drawing
     rows = rowsLocal;
     if (i >= rows.length) i = Math.max(0, rows.length - 1);
    const S = payload?.series || {};

    // --- RAW triangles FIRST (behind) ---
    // --- RAW triangles FIRST (behind) ---
    // Leader/trailer RAW are inferred from the same source the TABLE uses:
    // payload.points_by_x[<x>].raw.H / .raw.T
    // This makes chart-only plot raw winprob points even if series.leader_raw/trailer_raw are absent.
    const leaderRawDemX = [], leaderRawDemY = [];
    const leaderRawRepX = [], leaderRawRepY = [];
    const trailerRawDemX = [], trailerRawDemY = [];
    const trailerRawRepX = [], trailerRawRepY = [];

    // ===== FIXED: adjusted-only party lines from series.leader/trailer =====
    // Use leader/trailer series, not points_by_x.adjusted, and combine both series by color.
    // This keeps 50/50 points connected even when the 50/50 party is temporarily leader vs trailer.
    const repLX = [];
    const repLY = [];
    const demLX = [];
    const demLY = [];

    const pmap = payload?.points_by_x || {};

    const keys = Object.keys(pmap)
      .filter(k => k != null && k !== "")
      .sort((a, b) => Number(a) - Number(b));

    for (const k of keys) {
      const x = Number(k);
      if (!Number.isFinite(x)) continue;

      const p = pmap[k];

      // RAW points
      const raw = p?.raw || {};
      const h_raw = Number(raw?.H);
      const t_raw = Number(raw?.T);
      if (Number.isFinite(h_raw) && Number.isFinite(t_raw)){
        if (h_raw >= t_raw){
          leaderRawDemX.push(x); leaderRawDemY.push(h_raw);
          trailerRawRepX.push(x); trailerRawRepY.push(t_raw);
        } else {
          leaderRawRepX.push(x); leaderRawRepY.push(t_raw);
          trailerRawDemX.push(x); trailerRawDemY.push(h_raw);
        }
      } else {
        if (Number.isFinite(h_raw)) { trailerRawDemX.push(x); trailerRawDemY.push(h_raw); }
        if (Number.isFinite(t_raw)) { trailerRawRepX.push(x); trailerRawRepY.push(t_raw); }
      }
    }

    function addPartyLinePoints(series){
      if (!series) return;
      const xs = series.x || [], ys = series.y || [], cs = series.color || [];
      for (let k=0;k<xs.length;k++){
        const x = Number(xs[k]);
        const y = Number(ys[k]);
        const c = (cs[k]||'').toLowerCase();
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;

        if (c.includes('red')) {
          repLX.push(x);
          repLY.push(y);
        } else if (c.includes('blue')) {
          demLX.push(x);
          demLY.push(y);
        }
      }
    }

    addPartyLinePoints(S.leader);
    addPartyLinePoints(S.trailer);

    // Keep each party line in x order after combining leader + trailer.
    const repPts = repLX.map((x, n) => ({ x, y: repLY[n] })).sort((a, b) => a.x - b.x);
    const demPts = demLX.map((x, n) => ({ x, y: demLY[n] })).sort((a, b) => a.x - b.x);

    repLX.length = 0; repLY.length = 0;
    demLX.length = 0; demLY.length = 0;

    for (const p of repPts){
      repLX.push(p.x);
      repLY.push(p.y);
    }
    for (const p of demPts){
      demLX.push(p.x);
      demLY.push(p.y);
    }

    // Plot RAW triangles (behind). Raw leader/trailer partition is computed above,
    // but styling remains party-based (same triangles as legend).
    plotScatter(leaderRawRepX, leaderRawRepY, 'rep', 'tri');
    plotScatter(leaderRawDemX, leaderRawDemY, 'dem', 'tri');
    plotScatter(trailerRawRepX, trailerRawRepY, 'rep', 'tri');
    plotScatter(trailerRawDemX, trailerRawDemY, 'dem', 'tri');
 
    // Draw both lines - even if identical / overlapping
    plotLineLeft(repLX, repLY, 'lineRep');
    plotLineLeft(demLX, demLY, 'lineDem');
    // ===== END FIX =====


    // ===== END NEW =====

    // --- ADJUSTED (non-raw) NEXT (on top of raw) ---
    // Leader — solid party colors, circle
    if (S.leader){
      const xs = S.leader.x || [], ys = S.leader.y || [], cs = S.leader.color || [];
      const repX=[], repY=[], demX=[], demY=[];
      for (let k=0;k<xs.length;k++){
        const c = (cs[k]||'').toLowerCase();
        if (c.includes('red')) { repX.push(xs[k]); repY.push(ys[k]); }
        else if (c.includes('blue')) { demX.push(xs[k]); demY.push(ys[k]); }
      }
      plotScatter(repX, repY, 'repStrong', 'circle');  // solid red
      plotScatter(demX, demY, 'demStrong', 'circle');  // solid blue
    }

    // Trailer — solid party colors, square
    if (S.trailer){
      const xs = S.trailer.x || [], ys = S.trailer.y || [], cs = S.trailer.color || [];
      const repX=[], repY=[], demX=[], demY=[];
      for (let k=0;k<xs.length;k++){
        const c = (cs[k]||'').toLowerCase();
        if (c.includes('red')) { repX.push(xs[k]); repY.push(ys[k]); }
        else if (c.includes('blue')) { demX.push(xs[k]); demY.push(ys[k]); }
      }
      plotScatter(repX, repY, 'repStrong', 'square');  // solid red
      plotScatter(demX, demY, 'demStrong', 'square');  // solid blue
    }

    // --- Margin line (leave where you had it; no color changes) ---

     g.appendChild(cursorLine);
     if (rowsLocal.length) {
       const ix = Math.min(i, rowsLocal.length - 1);
      drawCursorAt(rowsLocal[ix].x);
     }
  }

  // ---- Playback / UI ----
  let rows = [];
  let i = 0;
  let timer = null;

  function stopAnim(){
    if (timer){ clearInterval(timer); timer=null; animateBtn.textContent='▶ Animate'; }
  }

  prevBtn.addEventListener('click', () => {
    stopAnim();
    i = Math.max(0, i - 1);
    renderRow();
  });

  nextBtn.addEventListener('click', () => {
    stopAnim();
    i = Math.min(rows.length - 1, i + 1);
    renderRow();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft'){ stopAnim(); i=Math.max(0,i-1); renderRow(); }
    if (e.key === 'ArrowRight'){ stopAnim(); i=Math.min(rows.length-1,i+1); renderRow(); }
  });

  animateBtn.addEventListener('click', () => {
    if (timer){ stopAnim(); return; }
    if (!rows.length) return;
    animateBtn.textContent = '⏸ Pause';
    timer = setInterval(() => {
      i += 1;
      if (i >= rows.length){
        if (isLoop) i = 0;
        else { stopAnim(); i = rows.length - 1; }
      }
      renderRow();
    }, 900);
  });

  function renderRow(){
    totalEl.textContent = String(rows.length || 0);
    if (!rows.length){
      bigXEl.textContent = '—';
      bigMarginEl.textContent = '—';
      bigMarginEl.style.color = '#111';

      xInEl.textContent = '—';
      yLeaderEl.textContent = '—';
      yLeaderRawEl.textContent = '—';
      yTrailerEl.textContent = '—';
      yTrailerRawEl.textContent = '—';
      yMarginEl.textContent = '—';
      idxEl.textContent = '0';
      drawCursorAt(0);
      return;
    }

    if (i < 0) i = 0;
    if (i >= rows.length) i = rows.length - 1;
    const r = rows[i];

    bigXEl.textContent = fmt(r.x, 2) + ' %';
    const mval = Number(r.margin_y);
    if (Number.isFinite(mval)){
      bigMarginEl.textContent = Math.abs(mval).toFixed(2) + ' %';
      bigMarginEl.style.color = (mval >= 0) ? '#1d4ed8' : '#ef4444';
    } else {
      bigMarginEl.textContent = '—';
      bigMarginEl.style.color = '#111';
    }

    xInEl.textContent = fmt(r.x,2) + ' %';
    yLeaderEl.textContent = fmt(r.leader_y,2) + ' p';
    yLeaderRawEl.textContent = fmt(r.leader_raw_y,2) + ' p';
    yTrailerEl.textContent = fmt(r.trailer_y,2) + ' p';
    yTrailerRawEl.textContent = fmt(r.trailer_raw_y,2) + ' p';
    yMarginEl.textContent = '—';


    idxEl.textContent = String(i + 1);
    drawCursorAt(r.x);
  }

  // ---- Fetch + poll ----
  let lastSig = null;
  function buildSig(j){
    const xs = j?.series?.leader?.x || [];
    const lastX = xs.length ? xs[xs.length - 1] : null;
    return JSON.stringify([j?.meta?.generated_at || null, xs.length, lastX]);
  }

  async function fetchData() {
    console.log("[chart] fetchData() called");

    if (!CURRENT_DATA_URL) {
      console.warn("[chart] fetchData aborted: no CURRENT_DATA_URL");
      return;
    }

    const url = CURRENT_DATA_URL + "?t=" + Date.now();
    console.log("[chart] fetching:", url);

    let resp;
    try {
      resp = await fetch(url, { cache: "no-store" });
    } catch (err) {
      console.error("[chart] fetch failed:", err);
      return;
    }

    console.log("[chart] fetch status:", resp.status);

    if (!resp.ok) {
      console.error("[chart] fetch not OK:", resp.status);
      return;
    }

    let json;
    try {
      json = await resp.json();
    } catch (err) {
      console.error("[chart] json parse failed:", err);
      return;
    }

    console.log("[chart] json loaded. keys:", Object.keys(json));
    console.log("[chart] series keys:", Object.keys(json.series || {}));

    // ⬇️ LEAVE everything below this line EXACTLY as you already had it
    if (!json.series || !json.series.leader || !json.series.leader.x?.length) {
      console.error("[chart] series missing or empty:", json.series);
      return;
    }

    drawPlotFromJSON(json);
  }


  // Start
  setInterval(() => {
    if (!CURRENT_DATA_URL) return;
    fetchData();
  }, POLL_MS);



  window.addEventListener("message", (ev) => {
    console.log("[chart] postMessage received:", ev.data);

    if (!ev.data) return;

    if (ev.data.type === "GAUGE_SET_SOURCE") {
      console.log("[chart] setting data source to:", ev.data.path);
      setDataSource(ev.data.path);
    }
  });
  console.log("[chart] message listener installed");

  // 🔧 SAFETY NET: allow standalone / late-message operation
  setTimeout(() => {
    if (!CURRENT_DATA_URL) {
      console.warn("[chart] no data source yet — waiting for message");
    }
  }, 500);


})();
    console.log("[chart] end of script reached");

</script>
